<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Chiếu Bài Học: 你好!</title>
    <style>
        /* Tối ưu hóa giao diện nền và font chữ */
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Khung chứa tiêu đề */
        .header {
            width: 100%;
            max-width: 960px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .header h1 {
            color: #2c3e50;
            font-size: 24px;
            margin: 0 0 10px 0;
        }

        /* Khung container tỉ lệ 16:9 để chống tràn và tự co giãn (Responsive) */
        .slide-container {
            position: relative;
            width: 90%;
            max-width: 960px;
            padding-bottom: 56.25%; /* Tỉ lệ chuẩn 16:9 */
            height: 0;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            border: 1px solid #e1e4e8;
            margin-bottom: 40px;
        }

        /* Định dạng khung iframe hiển thị slide mượt mà */
        .slide-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Trình Chiếu: 1第一课_你好!</h1>
    </div>

    <div class="slide-container">
        <iframe 
            src="https://docs.google.com/presentation/d/18u9ZLnfbyrSvi9BN_6ukfZ0bcOCVGqTI/preview" 
            allowfullscreen="true" 
            mozallowfullscreen="true" 
            webkitallowfullscreen="true">
        </iframe>
    </div>

</body>
</html>
