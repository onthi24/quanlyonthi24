
<!DOCTYPE html>
<html lang="vi">
<head>
    <base target="_blank">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giao diện bài giảng ONTHI24</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        // CẤU HÌNH KẾT NỐI
        const SHEET_ID = '1aC_WhBor3qJhVbHchKXQJgAmmDrw69ylOmFuZbDOuuA'; 
        const SHEET_TITLE = 'Trang tính1';
        const CONFIG_RANGE = 'B3:C12'; 
        const DATA_RANGE = 'A14:E200';
        const ADMIN_PASSWORD = 'admin123';
        const GH_OWNER = 'onthi24';
        const GH_REPO = 'quanlyonthi24';
    </script>
    <style>
        :root { --primary-green: #1e4620; --primary-orange: #e67e22; --main-red-brown: #782525; --text-white: #fff; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #fdfdfd; }
        .wrapper-layout { max-width: 1100px; margin: 0 auto; padding: 20px; }
        .top-navbar { background-color: #f1f4f6; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; }
        .logo-img { height: 45px; object-fit: contain; }
        .main-container { display: grid; grid-template-columns: 1fr 256px; background-color: #000; }
        .video-header { background-color: var(--primary-green); color: #fff; padding: 5px 15px; height: 32px; display: flex; justify-content: space-between; }
        .btn-register { background: linear-gradient(to bottom, #cfa846, #9c7514); color: #fff; padding: 10px 20px; border-radius: 20px; border: none; font-weight: bold; cursor: pointer; }
        .menu-item { padding: 8px 12px 8px 24px; cursor: pointer; border-top: 1px solid #eee; }
        .menu-item.active { background-color: #f0fdf4; border-left: 4px solid var(--primary-green); }
        .course-link-item.selected-active { background-color: var(--main-red-brown) !important; color: #fff; }
        #admin-panel { display: none; padding: 20px; background: #fff3cd; }
    </style>
</head>
<body>
    <div class="wrapper-layout">
        <div class="top-navbar">
            <div class="logo-box"><a href="#" class="logo-link"><img id="main-logo" src="" class="logo-img"></a></div>
        </div>
        <div class="subject-header-container">
            <div class="subject-title"><span id="base-subject-text">Loading...</span></div>
            <div class="search-box"><input type="text" id="search-input" oninput="checkAdminAuth(this.value)" placeholder="Tìm kiếm..."></div>
        </div>
        <div class="main-container" id="main-layout-container">
            <div class="video-column">
                <div class="video-header"><span id="current-lesson-title">Chọn bài học</span></div>
                <div class="video-wrapper"><iframe id="video-player" src="" allowfullscreen></iframe></div>
            </div>
            <div class="sidebar-column">
                <div class="sidebar-header" id="sidebar-title">Mục lục</div>
                <div class="menu-scroll-container" id="menu-container"></div>
            </div>
        </div>
        <div class="footer-action">
            <button class="btn-register" id="btn-reg">Đăng kí</button>
            <a href="#" id="link-intro" class="link-detail">Giới thiệu</a>
        </div>
        <div id="admin-panel">
            <input type="password" id="gh-token" placeholder="GitHub Token...">
            <button onclick="startAutoSync()">Cập nhật lên GitHub</button>
            <span id="update-status"></span>
        </div>
    </div>

    <script>
        async function loadSite() {
            const res = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${SHEET_TITLE}`).then(r => r.text());
            const data = JSON.parse(res.substr(47).slice(0, -2));
            const rows = data.table.rows;

            // 1. Áp dụng Config từ B3:C12
            document.documentElement.style.setProperty('--primary-green', rows[2].c[2].v);
            document.documentElement.style.setProperty('--main-red-brown', rows[3].c[2].v);
            document.getElementById('main-logo').src = rows[9].c[1].v.replace('/blob/', '/raw/');
            document.getElementById('base-subject-text').innerText = rows[10].c[1].v;
            document.getElementById('btn-reg').innerText = rows[7].c[1].v;
            document.getElementById('link-intro').innerText = rows[8].c[1].v;

            // 2. Render Dữ liệu bài giảng từ A14 trở đi
            // [Code logic render menu từ rows[13] trở đi vào #menu-container...]
            console.log("Dữ liệu đã sẵn sàng để xử lý");
        }

        function checkAdminAuth(val) { if (val === ADMIN_PASSWORD) document.getElementById('admin-panel').style.display = 'block'; }
        window.onload = loadSite;
    </script>
</body>
</html>
