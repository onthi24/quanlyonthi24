
<!DOCTYPE html>
<html lang="vi">
<head>
    <base target="_blank">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giao diện bài giảng ONTHI24</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <script>
        const SHEET_ID = '1aC_WhBor3qJhVbHchKXQJgAmmDrw69ylOmFuZbDOuuA';
        const SHEET_TITLE = 'Trang tính1';
        const CONFIG_RANGE = 'B3:C12'; // Vùng chứa thông số cấu hình
        const ADMIN_PASSWORD = 'admin123';
        const GH_OWNER = 'onthi24';
        const GH_REPO = 'quanlyonthi24';
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --primary-green: #1e4620; --primary-orange: #e67e22; --main-red-brown: #782525; }
        body, html { width: 100%; background-color: #fdfdfd; font-family: 'Segoe UI', Arial, sans-serif; overflow-x: hidden; }
        .wrapper-layout { max-width: 1100px; margin: 0 auto; padding: 20px; width: 100%; }
        /* ... Các class cũ giữ nguyên ... */
    </style>
</head>
<body>
    <div class="wrapper-layout">
        <div class="top-navbar">
            <div class="logo-box">
                <a href="#" class="logo-link"><img id="logo-img" src="" class="logo-img"></a>
            </div>
            </div>
        <div class="footer-action">
            <button class="btn-register" id="btn-reg"></button>
            <a href="#" id="link-intro" class="link-detail"></a>
        </div>
        </div>

    <script>
        // [Phần STATIC_DATA_STORE giữ nguyên]
        const STATIC_DATA_STORE = { /* Dữ liệu bài giảng của bạn */ };

        // [Phần script cũ giữ nguyên]
        
        // HÀM BỔ SUNG: Cấu hình giao diện từ Sheet
        async function applyConfigFromSheet() {
            try {
                const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${SHEET_TITLE}&range=${CONFIG_RANGE}`;
                const res = await fetch(url).then(r => r.text());
                const data = JSON.parse(res.substr(47).slice(0, -2));
                const rows = data.table.rows;

                // Map dữ liệu vào giao diện
                document.documentElement.style.setProperty('--primary-green', rows[0].c[1].v); // C3
                document.documentElement.style.setProperty('--main-red-brown', rows[1].c[1].v); // C4
                document.getElementById('logo-img').src = rows[7].c[0].v.replace('/blob/', '/raw/'); // B10
                document.getElementById('base-subject-text').innerText = rows[8].c[0].v; // B11
                document.getElementById('btn-reg').innerText = rows[5].c[0].v; // B8
                document.getElementById('link-intro').innerText = rows[6].c[0].v; // B9
            } catch(e) { console.log("Chưa load được cấu hình từ Sheet"); }
        }

        window.addEventListener('DOMContentLoaded', () => {
            applyConfigFromSheet(); // Gọi hàm load cấu hình
            // ... (Các đoạn init cũ giữ nguyên) ...
        });
    </script>
</body>
</html>
