    <script>
        let APP_CONFIG = {};

        // Hàm lấy dữ liệu từ Google Sheet (cả cấu hình và bài giảng)
        async function loadAllData() {
            const baseUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?`;
            
            // 1. Lấy cấu hình
            const configRes = await fetch(`${baseUrl}sheet=${SHEET_TITLE}&range=${CONFIG_RANGE}`).then(r => r.text());
            const configJson = JSON.parse(configRes.substr(47).slice(0, -2));
            
            // Map cấu hình vào biến toàn cục
            configJson.table.rows.forEach(row => {
                const key = row.c[0]?.v;
                const val = row.c[1]?.v;
                APP_CONFIG[key] = val;
            });

            // Áp dụng cấu hình giao diện
            document.documentElement.style.setProperty('--primary-green', APP_CONFIG['Xanh đậm (1)']);
            document.documentElement.style.setProperty('--main-red-brown', APP_CONFIG['Đỏ nâu (2)']);
            document.documentElement.style.setProperty('--text-white', APP_CONFIG['Trắng']);
            document.documentElement.style.setProperty('--text-black', APP_CONFIG['Đen']);
            document.getElementById('main-logo').src = APP_CONFIG['Link logo (github) code tự chuyển đổi'].replace('/blob/', '/raw/');
            document.getElementById('base-subject-text').innerText = APP_CONFIG['Tên môn học'];
            document.getElementById('btn-register-text').innerText = APP_CONFIG['Tên trên nút đăng kí tư vấn'];
            document.getElementById('link-intro-text').innerText = APP_CONFIG['Giới thiệu về'];

            // 2. Lấy dữ liệu bài giảng (Dùng logic parse mới cho 3 cấp)
            const dataRes = await fetch(`${baseUrl}sheet=${SHEET_TITLE}&range=${SHEET_RANGE}`).then(r => r.text());
            processLessonData(JSON.parse(dataRes.substr(47).slice(0, -2)));
        }

            // ...
        }

        window.addEventListener('DOMContentLoaded', loadAllData);
    </script>
