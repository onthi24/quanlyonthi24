<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Điểm Danh & Điểm Cộng</title>
  
  <!-- Thư viện docx.js để tạo file Word và FileSaver để hỗ trợ tải file -->
  <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #f0f2f5; margin: 0; padding: 20px; color: #333; }
    
    .page-title { text-align: center; color: #1e5631; font-size: 22px; font-weight: 700; margin-bottom: 20px; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 8px; }
    
    .main-layout { display: flex; gap: 20px; max-width: 1400px; margin: 0 auto; }
    
    /* Cột trái: Form */
    .left-col { flex: 0 0 380px; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: flex; flex-direction: column; }
    .card-header { background-color: #1e5631; color: #fff; padding: 12px 16px; font-weight: 700; font-size: 14px; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }
    .form-iframe { width: 100%; height: 680px; border: none; }

    /* Cột phải: Bảng dữ liệu */
    .right-col { flex: 1; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: flex; flex-direction: column; }
    
    .status-tag { font-size: 12px; font-weight: normal; text-transform: none; }
    .status-tag.success { color: #81c784; }
    .status-tag.warning { color: #ffb74d; }

    .filter-bar { background-color: #f4f6f8; padding: 12px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid #e0e0e0; }
    .search-input { position: relative; flex: 1; min-width: 160px; }
    .search-input input { width: 100%; padding: 8px 12px 8px 32px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; outline: none; }
    .search-input::before { content: '🔍'; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 12px; color: #888; }
    
    .filter-bar select, .filter-bar input[type="date"] { padding: 7px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; outline: none; background: #fff; }
    .filter-label { font-size: 13px; color: #555; }

    .btn-btn { padding: 7px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
    .btn-refresh { background: #2f65f6; color: #fff; }
    .btn-refresh:hover { background: #1e50d8; }
    .btn-docx { background: #1e5631; color: #fff; }
    .btn-docx:hover { background: #144d29; }

    /* Bảng dữ liệu */
    .table-responsive { overflow-x: auto; flex: 1; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
    th, td { padding: 10px 14px; border-bottom: 1px solid #eee; }
    thead th { background-color: #1e5631; color: #fff; font-weight: 700; text-transform: uppercase; font-size: 12px; }
    tbody tr:hover { background-color: #f9fbf9; }
    
    .text-center { text-align: center; }
    .text-bold { font-weight: bold; }

    .card-footer { padding: 12px 16px; background: #fff; border-top: 1px solid #eee; display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: #444; }

    /* Nút ẩn Sheet truy cập F2 */
    .secret-sheet-bar { max-width: 1400px; margin: 15px auto 0; text-align: right; display: none; padding-bottom: 20px; }
    .btn-secret { background: #1e5631; color: #fff; padding: 10px 18px; border-radius: 4px; text-decoration: none; font-size: 13px; font-weight: bold; display: inline-block; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
    .btn-secret:hover { background: #144d29; }
  </style>
</head>
<body>

  <div class="page-title">
    🎓 QUẢN LÝ ĐIỂM DANH & ĐIỂM CỘNG
  </div>

  <div class="main-layout">
    <!-- Cột trái: Google Form -->
    <div class="left-col">
      <div class="card-header">
        📝 NHẬP DỮ LIỆU MỚI
      </div>
      <iframe class="form-iframe" src="https://docs.google.com/forms/d/e/1FAIpQLSfTQCf0rWn3KXZDzFGTTwAX_jx5JQumMw7u7JqVblrzU9qNCw/viewform?embedded=true">Đang tải...</iframe>
    </div>

    <!-- Cột phải: Bảng Thống Kê -->
    <div class="right-col">
      <div class="card-header">
        <span>📋 TỔNG HỢP ĐIỂM SINH VIÊN</span>
        <span id="statusTag" class="status-tag warning">▲ Đang kết nối...</span>
      </div>

      <div class="filter-bar">
        <div class="search-input">
          <input type="text" id="searchTen" placeholder="Tìm theo tên..." oninput="filterAndRender()">
        </div>

        <select id="selectLop" onchange="filterAndRender()">
          <option value="">-- Tất cả lớp --</option>
        </select>

        <span class="filter-label">Từ:</span>
        <input type="date" id="dateFrom" onchange="filterAndRender()">

        <span class="filter-label">Đến:</span>
        <input type="date" id="dateTo" onchange="filterAndRender()">

        <button class="btn-btn btn-refresh" onclick="fetchLatestData()">🔄 Cập nhật</button>
        <button class="btn-btn btn-docx" onclick="exportToDocx()">📄 Tải Báo Cáo (.docx)</button>
      </div>

      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th class="text-center" style="width: 50px;">STT</th>
              <th>HỌ VÀ TÊN</th>
              <th class="text-center" style="width: 100px;">LỚP</th>
              <th class="text-center" style="width: 120px;">TỔNG ĐIỂM (+/-)</th>
              <th class="text-center" style="width: 140px;">SỐ LẦN ĐIỂM DANH</th>
              <th class="text-center" style="width: 160px;">LẦN CẬP NHẬT CUỐI</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="6" class="text-center" style="padding: 30px; color: #777;">Đang kiểm tra dữ liệu...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="card-footer">
        <span id="totalStudents">Tổng số: 0 sinh viên</span>
        <span id="totalScores">Tổng điểm cộng lớp: 0</span>
      </div>
    </div>
  </div>

  <!-- Nút truy cập Sheet (Hiện khi ấn F2) -->
  <div id="secretSheetBar" class="secret-sheet-bar">
    <a href="https://docs.google.com/spreadsheets/d/1VSMviBiQ8NCm1mQQe6UdtVciW2bZrVJJ-ivDCq43jZM" target="_blank" class="btn-secret">
      🔗 Truy cập </a>
  </div>

<script>
  const SPREADSHEET_ID = '1VSMviBiQ8NCm1mQQe6UdtVciW2bZrVJJ-ivDCq43jZM';
  const API_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json`;
  const STORAGE_KEY = 'DIEM_DANH_CACHE';

  let rawStudentData = [];
  let currentFilteredData = []; // Lưu dữ liệu đã lọc để xuất báo cáo Word

  window.onload = function() {
    // 1. Đọc dữ liệu từ bộ nhớ đệm
    const cached = localStorage.getItem(STORAGE_KEY);
    if (cached) {
      try {
        rawStudentData = JSON.parse(cached);
        populateClassOptions();
        filterAndRender();
        updateStatus('▲ Lỗi cập nhật (đang dùng đệm)', false);
      } catch (e) {
        console.error("Cache lỗi", e);
      }
    }

    // 2. Tải dữ liệu mới
    fetchLatestData();

    // 3. Phím tắt F2
    document.addEventListener('keydown', function(e) {
      if (e.key === 'F2') {
        e.preventDefault();
        const bar = document.getElementById('secretSheetBar');
        if (bar.style.display === 'block') {
          bar.style.display = 'none';
        } else {
          bar.style.display = 'block';
          window.scrollTo({
            top: document.body.scrollHeight,
            behavior: 'smooth'
          });
        }
      }
    });
  };

  async function fetchLatestData() {
    updateStatus('⏳ Đang đồng bộ...', false);
    try {
      const res = await fetch(`${API_URL}&t=${Date.now()}`);
      const text = await res.text();
      const jsonStr = text.substring(47, text.length - 2);
      const json = JSON.parse(jsonStr);

      processSheetRows(json.table.rows);

      localStorage.setItem(STORAGE_KEY, JSON.stringify(rawStudentData));

      populateClassOptions();
      filterAndRender();
      updateStatus('✔ Đã cập nhật mới nhất', true);
    } catch (err) {
      console.error('Lỗi gọi API Google Sheet:', err);
      if (rawStudentData.length === 0) {
        document.getElementById('tableBody').innerHTML = `<tr><td colspan="6" class="text-center" style="color:red;">Lỗi kết nối dữ liệu. Vui lòng thử lại!</td></tr>`;
      }
      updateStatus('▲ Lỗi cập nhật (đang dùng đệm)', false);
    }
  }

  function processSheetRows(rows) {
    if (!rows) return;
    let studentMap = {};

    rows.forEach(r => {
      if (!r.c) return;

      const timeStr = r.c[0] && r.c[0].f ? r.c[0].f : (r.c[0] && r.c[0].v ? String(r.c[0].v) : '');
      const hoTen = r.c[1] && r.c[1].v ? String(r.c[1].v).trim() : '';
      const lop = r.c[2] && r.c[2].v ? String(r.c[2].v).trim() : '';
      
      let stt = 0;
      if (r.c[3] && r.c[3].v !== null && r.c[3].v !== undefined) {
        stt = parseInt(r.c[3].v) || 0;
      }

      let diem = 0;
      if (r.c[4] && r.c[4].v !== null && r.c[4].v !== undefined) {
        diem = parseFloat(r.c[4].v) || 0;
      }

      if (hoTen && lop) {
        const key = `${hoTen}_${lop}`;
        if (!studentMap[key]) {
          studentMap[key] = {
            stt: stt,
            hoTen: hoTen,
            lop: lop,
            tongDiem: 0,
            soLanDiemDanh: 0,
            capNhatCuoi: timeStr
          };
        }
        
        studentMap[key].tongDiem += diem;

        if (diem === 0) {
          studentMap[key].soLanDiemDanh += 1;
        }

        if (timeStr) studentMap[key].capNhatCuoi = timeStr;
        if (stt > 0) studentMap[key].stt = stt;
      }
    });

    rawStudentData = Object.values(studentMap);
  }

  function populateClassOptions() {
    const selectLop = document.getElementById('selectLop');
    const curVal = selectLop.value;

    const classList = [...new Set(rawStudentData.map(s => s.lop))].sort();

    selectLop.innerHTML = '<option value="">-- Tất cả lớp --</option>';
    classList.forEach(c => {
      selectLop.innerHTML += `<option value="${c}">${c}</option>`;
    });

    selectLop.value = curVal;
  }

  function filterAndRender() {
    const searchTen = document.getElementById('searchTen').value.toLowerCase().trim();
    const selectedLop = document.getElementById('selectLop').value;

    currentFilteredData = rawStudentData.filter(s => {
      const matchTen = !searchTen || s.hoTen.toLowerCase().includes(searchTen);
      const matchLop = !selectedLop || s.lop === selectedLop;
      return matchTen && matchLop;
    });

    currentFilteredData.sort((a, b) => a.stt - b.stt);

    renderTable(currentFilteredData);
  }

  function renderTable(data) {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    if (data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" class="text-center" style="padding: 20px; color: #888;">Không tìm thấy dữ liệu phù hợp.</td></tr>`;
      document.getElementById('totalStudents').innerText = `Tổng số: 0 sinh viên`;
      document.getElementById('totalScores').innerText = `Tổng điểm cộng lớp: 0`;
      return;
    }

    let grandTotalScore = 0;

    data.forEach((item) => {
      grandTotalScore += item.tongDiem;
      const tr = document.createElement('tr');

      tr.innerHTML = `
        <td class="text-center text-bold">${item.stt || '-'}</td>
        <td class="text-bold">${item.hoTen}</td>
        <td class="text-center">${item.lop}</td>
        <td class="text-center text-bold" style="color: ${item.tongDiem > 0 ? '#1e5631' : '#333'}">${item.tongDiem}</td>
        <td class="text-center text-bold" style="color: #2f65f6;">${item.soLanDiemDanh}</td>
        <td class="text-center" style="color: #666; font-size: 12px;">${item.capNhatCuoi || '-'}</td>
      `;
      tbody.appendChild(tr);
    });

    document.getElementById('totalStudents').innerText = `Tổng số: ${data.length} sinh viên`;
    document.getElementById('totalScores').innerText = `Tổng điểm cộng lớp: ${grandTotalScore}`;
  }

  function updateStatus(msg, isSuccess) {
    const tag = document.getElementById('statusTag');
    tag.innerText = msg;
    tag.className = `status-tag ${isSuccess ? 'success' : 'warning'}`;
  }

  // --- HÀM TẠO FILE BÁO CÁO WORD (.DOCX) ---
  function exportToDocx() {
    if (!currentFilteredData || currentFilteredData.length === 0) {
      alert("Không có dữ liệu để xuất báo cáo!");
      return;
    }

    const selectedLop = document.getElementById('selectLop').value || "Tất cả các lớp";
    const nowStr = new Date().toLocaleString('vi-VN');
    let totalScore = 0;

    // 1. Tạo Header cho bảng Word
    const tableHeaderRows = new docx.TableRow({
      tableHeader: true,
      children: [
        createTableCell("STT", true, "10%", docx.AlignmentType.CENTER, "1e5631", "FFFFFF"),
        createTableCell("HỌ VÀ TÊN", true, "30%", docx.AlignmentType.LEFT, "1e5631", "FFFFFF"),
        createTableCell("LỚP", true, "15%", docx.AlignmentType.CENTER, "1e5631", "FFFFFF"),
        createTableCell("TỔNG ĐIỂM (+/-)", true, "15%", docx.AlignmentType.CENTER, "1e5631", "FFFFFF"),
        createTableCell("SỐ LẦN ĐIỂM DANH", true, "15%", docx.AlignmentType.CENTER, "1e5631", "FFFFFF"),
        createTableCell("LẦN CẬP NHẬT CUỐI", true, "15%", docx.AlignmentType.CENTER, "1e5631", "FFFFFF"),
      ],
    });

    // 2. Tạo các hàng dữ liệu sinh viên
    const tableDataRows = currentFilteredData.map((item) => {
      totalScore += item.tongDiem;
      return new docx.TableRow({
        children: [
          createTableCell(String(item.stt || '-'), false, "10%", docx.AlignmentType.CENTER),
          createTableCell(item.hoTen, true, "30%", docx.AlignmentType.LEFT),
          createTableCell(item.lop, false, "15%", docx.AlignmentType.CENTER),
          createTableCell(String(item.tongDiem), true, "15%", docx.AlignmentType.CENTER),
          createTableCell(String(item.soLanDiemDanh), false, "15%", docx.AlignmentType.CENTER),
          createTableCell(item.capNhatCuoi || '-', false, "15%", docx.AlignmentType.CENTER),
        ],
      });
    });

    // 3. Tạo Hàng Tổng Cộng
    const tableFooterRow = new docx.TableRow({
      children: [
        new docx.TableCell({
          columnSpan: 3,
          children: [new docx.Paragraph({ children: [new docx.TextRun({ text: `TỔNG CỘNG (${currentFilteredData.length} sinh viên)`, bold: true })], alignment: docx.AlignmentType.RIGHT })],
          shading: { fill: "F4F6F8" },
          padding: { top: 100, bottom: 100, left: 100, right: 100 }
        }),
        createTableCell(String(totalScore), true, "15%", docx.AlignmentType.CENTER, "F4F6F8"),
        createTableCell("-", false, "15%", docx.AlignmentType.CENTER, "F4F6F8"),
        createTableCell("-", false, "15%", docx.AlignmentType.CENTER, "F4F6F8"),
      ]
    });

    // 4. Khởi tạo tài liệu Word
    const doc = new docx.Document({
      sections: [{
        properties: {},
        children: [
          new docx.Paragraph({
            children: [new docx.TextRun({ text: "BÁO CÁO THỐNG KÊ ĐIỂM DANH & ĐIỂM CỘNG", bold: true, size: 28, color: "1e5631" })],
            alignment: docx.AlignmentType.CENTER,
            space: { after: 300 }
          }),
          new docx.Paragraph({
            children: [
              new docx.TextRun({ text: `Đơn vị/Lớp: `, bold: true }),
              new docx.TextRun({ text: selectedLop }),
            ],
            space: { after: 100 }
          }),
          new docx.Paragraph({
            children: [
              new docx.TextRun({ text: `Thời điểm xuất báo cáo: `, bold: true }),
              new docx.TextRun({ text: nowStr }),
            ],
            space: { after: 300 }
          }),
          new docx.Table({
            width: { size: 100, type: docx.WidthType.PERCENTAGE },
            rows: [tableHeaderRows, ...tableDataRows, tableFooterRow]
          })
        ]
      }]
    });

    // 5. Xuất file về máy
    docx.Packer.toBlob(doc).then((blob) => {
      saveAs(blob, `Bao_Cao_Diem_Danh_${selectedLop.replace(/[^a-zA-Z0-9]/g, "_")}.docx`);
    });
  }

  // Hàm phụ trợ tạo Cell cho Bảng Word
  function createTableCell(text, isBold, widthPct, align, bgColor = "FFFFFF", textColor = "000000") {
    return new docx.TableCell({
      width: { size: parseFloat(widthPct), type: docx.WidthType.PERCENTAGE },
      shading: { fill: bgColor },
      padding: { top: 100, bottom: 100, left: 100, right: 100 },
      children: [
        new docx.Paragraph({
          children: [new docx.TextRun({ text: text, bold: isBold, color: textColor, size: 20 })],
          alignment: align
        })
      ]
    });
  }
</script>

</body>
</html>
