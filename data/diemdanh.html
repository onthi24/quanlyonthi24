<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Điểm Danh & Điểm Cộng</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    
    h1 { text-align: center; color: #1a237e; font-size: 24px; margin-bottom: 20px; text-transform: uppercase; }
    
    .filter-box { background-color: #e8eaf6; padding: 15px 20px; border-radius: 8px; display: flex; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; border: 1px solid #c5cae9; }
    .filter-group { display: flex; align-items: center; gap: 10px; }
    .filter-group label { font-weight: bold; color: #1a237e; font-size: 14px; }
    .filter-group select, .filter-group input { padding: 8px 12px; border: 1px solid #c5cae9; border-radius: 5px; outline: none; font-size: 14px; background: #fff; }
    
    .btn-sheet { display: none; margin-left: auto; background-color: #2e7d32; color: white; padding: 8px 16px; border-radius: 5px; text-decoration: none; font-weight: bold; font-size: 14px; transition: background 0.2s; }
    .btn-sheet:hover { background-color: #1b5e20; }

    .table-responsive { overflow-x: auto; border: 1px solid #c5cae9; border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; text-align: center; font-size: 14px; background: #fff; }
    th, td { border: 1px solid #e0e0e0; padding: 10px; }
    thead th { background-color: #1a237e; color: #ffffff; font-weight: 600; }
    tbody tr:nth-child(even) { background-color: #f8f9fa; }
    tbody tr:hover { background-color: #e8eaf6; }
    
    .badge-score { font-weight: bold; padding: 4px 8px; border-radius: 4px; }
    .score-pos { color: #2e7d32; background-color: #e8f5e9; }
    .score-zero { color: #757575; background-color: #eee; }

    .status-bar { margin-top: 10px; font-size: 12px; color: #666; text-align: right; italic: true; }
  </style>
</head>
<body>

<div class="container">
  <h1>BẢNG THỐNG KÊ ĐIỂM DANH & ĐIỂM CỘNG</h1>

  <div class="filter-box">
    <div class="filter-group">
      <label for="selectLop">LỚP:</label>
      <select id="selectLop" onchange="filterAndRender()">
        <option value="">-- Tất cả các lớp --</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="searchTen">HỌ TÊN:</label>
      <input type="text" id="searchTen" placeholder="Nhập tên tìm kiếm..." oninput="filterAndRender()">
    </div>

    <!-- Nút mở Sheet ẩn, nhấn F2 để hiện/ẩn -->
    <a id="btnSheet" class="btn-sheet" href="https://docs.google.com/spreadsheets/d/1VSMviBiQ8NCm1mQQe6UdtVciW2bZrVJJ-ivDCq43jZM" target="_blank">🔗 Mở Google Sheet</a>
  </div>

  <div class="table-responsive">
    <table>
      <thead>
        <tr>
          <th style="width: 60px;">STT</th>
          <th style="width: 120px;">Lớp</th>
          <th style="text-align: left; padding-left: 15px;">Họ và tên</th>
          <th style="width: 140px;">Tổng điểm cộng</th>
          <th style="width: 140px;">Số lần điểm danh</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="5">Đang tải dữ liệu...</td></tr>
      </tbody>
    </table>
  </div>
  
  <div class="status-bar" id="statusBar">Đang cập nhật...</div>
</div>

<script>
  const SPREADSHEET_ID = '1VSMviBiQ8NCm1mQQe6UdtVciW2bZrVJJ-ivDCq43jZM';
  const API_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json`;
  const STORAGE_KEY = 'SHEET_DATA_CACHE';

  let rawData = [];

  window.onload = function() {
    // 1. Đọc bộ nhớ đệm trước để hiển thị tức thì
    const cached = localStorage.getItem(STORAGE_KEY);
    if (cached) {
      try {
        rawData = JSON.parse(cached);
        populateClassFilter();
        filterAndRender();
        document.getElementById('statusBar').innerText = 'Đã hiển thị từ bộ nhớ đệm. Đang đồng bộ mới...';
      } catch (e) {
        console.log('Cache cũ không hợp lệ');
      }
    }

    // 2. Chạy ngầm gọi API cập nhật dữ liệu mới nhất
    fetchLatestData();

    // 3. Đăng ký sự kiện nhấn phím F2 để ẩn/mở nút Google Sheet
    document.addEventListener('keydown', function(e) {
      if (e.key === 'F2') {
        e.preventDefault();
        const btn = document.getElementById('btnSheet');
        btn.style.display = (btn.style.display === 'inline-block') ? 'none' : 'inline-block';
      }
    });
  };

  async function fetchLatestData() {
    try {
      // Gắn timestamp &t= để vượt qua cache trình duyệt khi nhấn F5
      const response = await fetch(`${API_URL}&t=${Date.now()}`);
      const text = await response.text();
      
      // Bóc tách JSON từ chuỗi phản hồi Google Visualization API
      const jsonString = text.substring(47, text.length - 2);
      const json = JSON.parse(jsonString);
      
      parseSheetRows(json.table.rows);

      // Lưu bản ghi mới vào localStorage
      localStorage.setItem(STORAGE_KEY, JSON.stringify(rawData));

      // Cập nhật lại giao diện
      populateClassFilter();
      filterAndRender();

      const now = new Date().toLocaleTimeString('vi-VN');
      document.getElementById('statusBar').innerText = `Cập nhật dữ liệu mới nhất lúc: ${now}`;
    } catch (err) {
      console.error('Lỗi tải dữ liệu Google Sheet:', err);
      if (rawData.length === 0) {
        document.getElementById('tableBody').innerHTML = '<tr><td colspan="5" style="color:red;">Không thể tải dữ liệu. Vui lòng kiểm tra lại đường truyền hoặc quyền chia sẻ của Sheet!</td></tr>';
      }
    }
  }

  function parseSheetRows(rows) {
    if (!rows) return;
    
    // Mảng lưu dữ liệu đã gộp theo Sinh viên
    let studentMap = {};

    rows.forEach(r => {
      if (!r.c) return;

      // Cột B (c[1]): Họ tên, Cột C (c[2]): Lớp, Cột D (c[3]): STT, Cột E (c[4]): Điểm cộng
      const hoTen = r.c[1] && r.c[1].v ? String(r.c[1].v).trim() : '';
      const lop = r.c[2] && r.c[2].v ? String(r.c[2].v).trim() : '';
      
      // Xử lý ô trống cho Cột E (Điểm cộng/trừ)
      let diem = 0;
      if (r.c[4] && r.c[4].v !== null && r.c[4].v !== undefined) {
        diem = parseFloat(r.c[4].v) || 0;
      }

      if (hoTen && lop) {
        const key = `${hoTen}_${lop}`;
        if (!studentMap[key]) {
          studentMap[key] = {
            hoTen: hoTen,
            lop: lop,
            tongDiem: 0,
            soLanDiemDanh: 0
          };
        }
        studentMap[key].tongDiem += diem;
        studentMap[key].soLanDiemDanh += 1;
      }
    });

    rawData = Object.values(studentMap);
  }

  function populateClassFilter() {
    const selectLop = document.getElementById('selectLop');
    const selectedVal = selectLop.value;
    
    const dsnLop = [...new Set(rawData.map(item => item.lop))].sort();

    selectLop.innerHTML = '<option value="">-- Tất cả các lớp --</option>';
    dsnLop.forEach(l => {
      selectLop.innerHTML += `<option value="${l}">${l}</option>`;
    });

    selectLop.value = selectedVal;
  }

  function filterAndRender() {
    const selectedLop = document.getElementById('selectLop').value;
    const searchTen = document.getElementById('searchTen').value.toLowerCase().trim();

    const filtered = rawData.filter(item => {
      const matchLop = !selectedLop || item.lop === selectedLop;
      const matchTen = !searchTen || item.hoTen.toLowerCase().includes(searchTen);
      return matchLop && matchTen;
    });

    renderTable(filtered);
  }

  function renderTable(data) {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    if (data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5">Không tìm thấy dữ liệu phù hợp.</td></tr>';
      return;
    }

    data.forEach((item, index) => {
      const tr = document.createElement('tr');
      const scoreClass = item.tongDiem > 0 ? 'score-pos' : 'score-zero';

      tr.innerHTML = `
        <td>${index + 1}</td>
        <td>${item.lop}</td>
        <td style="text-align: left; padding-left: 15px; font-weight: 600;">${item.hoTen}</td>
        <td><span class="badge-score ${scoreClass}">${item.tongDiem > 0 ? '+' + item.tongDiem : item.tongDiem}</span></td>
        <td>${item.soLanDiemDanh}</td>
      `;
      tbody.appendChild(tr);
    });
  }
</script>

</body>
</html>
