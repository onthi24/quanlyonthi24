<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HỆ THỐNG QUẢN LÝ LỊCH HỌC VÀ TRỢ GIẢNG</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-green: #1b4d3e;
            --header-bg: #1e4d3b;
            --panel-bg: #e8f5e9;
            --panel-border: #c8e6c9;
            --btn-blue: #0288d1;
            --btn-blue-hover: #0277bd;
            --border-color: #a5d6a7;
            --text-color: #1b4d3e;
            --table-hover: #f1f8e9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Title */
        .page-title {
            text-align: center;
            color: var(--primary-green);
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Filter Panel Design */
        .filter-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 15px;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-group label {
            font-weight: 700;
            color: var(--primary-green);
            font-size: 14px;
            white-space: nowrap;
        }

        .filter-control {
            padding: 8px 12px;
            border: 1px solid #b0bec5;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            background-color: #fff;
            min-width: 160px;
        }

        .filter-control:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 2px rgba(27, 77, 62, 0.2);
        }

        .btn-update {
            background-color: var(--btn-blue);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background-color 0.2s;
        }

        .btn-update:hover {
            background-color: var(--btn-blue-hover);
        }

        /* Table Design */
        .table-card {
            background: #fff;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 14px;
        }

        thead tr {
            background-color: var(--header-bg);
            color: white;
        }

        th {
            padding: 12px 10px;
            font-weight: 700;
            border: 1px solid #2e7d32;
            white-space: nowrap;
        }

        td {
            padding: 10px;
            border: 1px solid var(--border-color);
            white-space: nowrap;
        }

        tbody tr:nth-child(even) {
            background-color: #fafafa;
        }

        tbody tr:hover {
            background-color: var(--table-hover);
        }

        .align-left {
            text-align: left;
        }

        .check-icon {
            color: #2e7d32;
            font-weight: bold;
            font-size: 16px;
        }

        .badge-class {
            background-color: #e8f5e9;
            color: var(--primary-green);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            border: 1px solid #c8e6c9;
        }

        /* Table Footer / Summary */
        tfoot tr {
            background-color: var(--panel-bg);
            font-weight: bold;
            color: var(--primary-green);
        }

        tfoot td {
            border-top: 2px solid var(--primary-green);
        }

        /* Status & Loading */
        .loading-box, .empty-box {
            text-align: center;
            padding: 30px;
            color: #666;
            font-size: 15px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary-green);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .filter-panel { flex-direction: column; align-items: stretch; }
            .filter-group { flex-direction: column; align-items: flex-start; }
            .filter-control { width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="page-title">BẢNG THỐNG KÊ LỊCH HỌC VÀ TRỢ GIẢNG</h1>

    <!-- Khung bộ lọc dữ liệu -->
    <div class="filter-panel">
        <div class="filter-group">
            <label for="daySelect">LỰA CHỌN THỨ / CA:</label>
            <select id="daySelect" class="filter-control" onchange="filterData()">
                <option value="ALL">-- Tất cả các Thứ / Ca --</option>
                <!-- Các cột Ca/Thứ từ cột J trở đi sẽ tự động load vào đây -->
            </select>
        </div>

        <div class="filter-group">
            <label for="classSelect">DANH SÁCH LỚP:</label>
            <select id="classSelect" class="filter-control" onchange="filterData()">
                <option value="ALL">-- Tất cả các lớp --</option>
                <option value="T12">Toán 12 (T12)</option>
                <option value="L12">Lí 12 (L12)</option>
                <option value="TL12">Cả Toán 12 & Lí 12 (TL12)</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="searchInput">TÌM TÊN (TG/HS):</label>
            <input type="text" id="searchInput" class="filter-control" placeholder="Nhập tên Trợ giảng hoặc Học sinh..." oninput="filterData()">
        </div>

        <button class="btn-update" onclick="fetchData()">
            <i class="fa-solid fa-rotate"></i> Cập nhật
        </button>
    </div>

    <!-- Bảng hiển thị dữ liệu -->
    <div class="table-card">
        <div class="table-responsive">
            <table id="dataTable">
                <thead>
                    <tr id="tableHeader">
                        <th>STT</th>
                        <th>Tên Trợ Giảng</th>
                        <th>Tên Học Sinh</th>
                        <th>Mã Lớp</th>
                        <!-- Các cột Ca / Thứ từ cột J trở đi sẽ tự động sinh ở đây -->
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Dữ liệu render tại đây -->
                </tbody>
                <tfoot id="tableFooter">
                    <!-- Dòng thống kê tổng cộng -->
                </tfoot>
            </table>

            <div id="loadingBox" class="loading-box">
                <div class="spinner"></div>
                <span>Đang tải dữ liệu từ Google Sheets...</span>
            </div>

            <div id="emptyBox" class="empty-box" style="display: none;">
                <i class="fa-regular fa-folder-open" style="font-size: 30px; margin-bottom: 8px;"></i>
                <p>Không tìm thấy dữ liệu phù hợp với bộ lọc.</p>
            </div>
        </div>
    </div>
</div>

<script>
    // Configuration
    const SPREADSHEET_ID = '184GlzoYfIgPssbLO1yJEOYr41UsOSqF_';
    const SHEET_NAME = 'dulieu';
    const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;

    // Global Data Store
    let rawRows = [];
    let dynamicHeaders = []; // Danh sách tên các Ca/Thứ (từ Cột J trở đi)

    document.addEventListener('DOMContentLoaded', () => {
        fetchData();
    });

    /**
     * Tải dữ liệu từ Google Sheets API (/gviz/tq)
     */
    async function fetchData() {
        showLoading(true);
        try {
            const res = await fetch(GVIZ_URL);
            const text = await res.text();
            
            // Extract JSON from JSONP wrapper
            const match = text.match(/google\.visualization\.Query\.setResponse\((.*)\);?/s);
            if (!match || !match[1]) throw new Error("Cấu trúc dữ liệu không hợp lệ");

            const json = JSON.parse(match[1]);
            processRawData(json.table);
            
            // Build dropdown Thứ / Ca
            populateDayDropdown();
            
            // Filter & Render
            filterData();
        } catch (err) {
            console.error("Lỗi khi tải dữ liệu:", err);
            alert("Không thể kết nối dữ liệu Google Sheet. Vui lòng kiểm tra lại quyền truy cập file!");
        } finally {
            showLoading(false);
        }
    }

    /**
     * Bóc tách bảng dữ liệu thô
     */
    function processRawData(table) {
        if (!table) return;

        // Trích xuất danh sách cột Ca / Thứ từ cột J (Index 9) trở đi
        dynamicHeaders = [];
        for (let i = 9; i < table.cols.length; i++) {
            const label = table.cols[i]?.label || `Ca ${i - 8}`;
            dynamicHeaders.push({ index: i, label: label });
        }

        // Bóc tách hàng dữ liệu
        rawRows = table.rows.map(row => {
            const cells = row.c || [];
            return cells.map(cell => {
                if (!cell) return '';
                return cell.f !== undefined && cell.f !== null ? cell.f : (cell.v !== undefined && cell.v !== null ? cell.v : '');
            });
        });
    }

    /**
     * Nạp danh sách Thứ / Ca học vào Dropdown bộ lọc
     */
    function populateDayDropdown() {
        const daySelect = document.getElementById('daySelect');
        const currentValue = daySelect.value;
        
        daySelect.innerHTML = '<option value="ALL">-- Tất cả các Thứ / Ca --</option>';
        dynamicHeaders.forEach(dh => {
            const opt = document.createElement('option');
            opt.value = dh.index;
            opt.innerText = dh.label;
            daySelect.appendChild(opt);
        });

        daySelect.value = currentValue;
    }

    /**
     * Thuật toán lọc đa điều kiện
     */
    function filterData() {
        const dayFilter = document.getElementById('daySelect').value;
        const classFilter = document.getElementById('classSelect').value;
        const searchKey = document.getElementById('searchInput').value.toLowerCase().trim();

        const filtered = rawRows.filter(row => {
            // Cột B (Index 1): Tên Trợ Giảng, Cột C (Index 2): Tên Học Sinh, Cột D (Index 3): Mã Lớp
            const troGiang = String(row[1] || '');
            const hocSinh = String(row[2] || '');
            const maLop = String(row[3] || '').toUpperCase();

            // 1. Lọc theo lớp (T12, L12, TL12)
            if (classFilter !== 'ALL') {
                if (classFilter === 'T12') {
                    // Chọn Toán 12 -> Lấy cả T12 và TL12
                    if (!maLop.includes('T12') && !maLop.includes('TL12')) return false;
                } else if (classFilter === 'L12') {
                    // Chọn Lí 12 -> Lấy cả L12 và TL12
                    if (!maLop.includes('L12') && !maLop.includes('TL12')) return false;
                } else if (classFilter === 'TL12') {
                    // Chọn TL12 -> Lấy chính xác TL12
                    if (maLop !== 'TL12') return false;
                }
            }

            // 2. Lọc theo Thứ / Ca (Cột J trở đi có số 1)
            if (dayFilter !== 'ALL') {
                const colIdx = parseInt(dayFilter);
                const val = String(row[colIdx] || '').trim();
                // Nếu giá trị không phải là 1 (hoặc >0) -> Loại
                if (val !== '1' && val !== '1.0' && val !== 'x' && val !== 'X') return false;
            }

            // 3. Tìm kiếm theo tên Trợ Giảng hoặc Học Sinh (Cột B, C, D)
            if (searchKey !== '') {
                const matchTG = troGiang.toLowerCase().includes(searchKey);
                const matchHS = hocSinh.toLowerCase().includes(searchKey);
                const matchLop = maLop.toLowerCase().includes(searchKey);
                if (!matchTG && !matchHS && !matchLop) return false;
            }

            return true;
        });

        renderTable(filtered);
    }

    /**
     * Render dữ liệu ra bảng HTML
     */
    function renderTable(data) {
        const theadTr = document.getElementById('tableHeader');
        const tbody = document.getElementById('tableBody');
        const tfoot = document.getElementById('tableFooter');

        // Clean table
        tbody.innerHTML = '';
        tfoot.innerHTML = '';

        // Build Table Header Dynamically
        theadTr.innerHTML = `
            <th style="width: 50px;">STT</th>
            <th>Tên Trợ Giảng</th>
            <th>Tên Học Sinh</th>
            <th>Lớp</th>
        `;
        
        dynamicHeaders.forEach(dh => {
            const th = document.createElement('th');
            th.innerText = dh.label;
            theadTr.appendChild(th);
        });

        if (data.length === 0) {
            showEmpty(true);
            return;
        }
        showEmpty(false);

        // Mảng tính tổng số lượt tham gia cho từng Ca/Thứ
        const dayCounts = new Array(dynamicHeaders.length).fill(0);

        // Build Table Rows
        data.forEach((row, idx) => {
            const tr = document.createElement('tr');

            const troGiang = row[1] || '';
            const hocSinh = row[2] || '';
            const maLop = row[3] || '';

            let rowHtml = `
                <td>${idx + 1}</td>
                <td class="align-left">${troGiang}</td>
                <td class="align-left"><strong>${hocSinh}</strong></td>
                <td><span class="badge-class">${maLop}</span></td>
            `;

            // Duyệt qua các cột Thứ/Ca
            dynamicHeaders.forEach((dh, dIdx) => {
                const val = String(row[dh.index] || '').trim();
                const isPresent = (val === '1' || val === '1.0' || val.toLowerCase() === 'x');

                if (isPresent) {
                    dayCounts[dIdx]++;
                    rowHtml += `<td><span class="check-icon">✓</span></td>`;
                } else {
                    rowHtml += `<td>-</td>`;
                }
            });

            tr.innerHTML = rowHtml;
            tbody.appendChild(tr);
        });

        // Build Table Footer (Thống kê Tổng cộng)
        let footHtml = `
            <tr>
                <td colspan="4" style="text-align: right; padding-right: 15px;">TỔNG CỘNG ĐĂNG KÝ:</td>
        `;
        dayCounts.forEach(count => {
            footHtml += `<td>${count}</td>`;
        });
        footHtml += `</tr>`;
        tfoot.innerHTML = footHtml;
    }

    function showLoading(visible) {
        document.getElementById('loadingBox').style.display = visible ? 'block' : 'none';
    }

    function showEmpty(visible) {
        document.getElementById('emptyBox').style.display = visible ? 'block' : 'none';
    }
</script>

</body>
</html>
