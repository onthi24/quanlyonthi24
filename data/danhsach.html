<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Lịch Học & Trợ Giảng</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-dark: #1b4d3e;
            --primary-header: #1e4d3b;
            --panel-bg: #e8f5e9;
            --border-color: #a5d6a7;
            --card-shadow: 0 4px 12px rgba(27, 77, 62, 0.08);
            --accent-blue: #0288d1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #f4f7f6; color: #333; padding: 24px; }
        .container { max-width: 1200px; margin: 0 auto; }

        .page-header { text-align: center; margin-bottom: 20px; }
        .page-title { color: var(--primary-dark); font-size: 24px; font-weight: 700; text-transform: uppercase; }

        /* Khung điều khiển bộ lọc */
        .filter-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 24px;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
        }

        .filter-group { display: flex; align-items: center; gap: 8px; }
        .filter-group label { font-weight: 600; color: var(--primary-dark); font-size: 13px; white-space: nowrap; }
        .filter-control {
            padding: 8px 12px;
            border: 1px solid #b0bec5;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            background: #fff;
            min-width: 150px;
        }

        .btn-reset {
            margin-left: auto;
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s;
        }
        .btn-reset:hover { opacity: 0.9; }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 16px 0 8px 0;
        }
        .section-title { font-size: 16px; font-weight: 700; color: var(--primary-dark); }
        .badge-count { background: var(--primary-dark); color: white; padding: 2px 10px; border-radius: 12px; font-size: 12px; }

        /* Bảng dữ liệu */
        .table-card {
            background: #fff;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: var(--card-shadow);
            margin-bottom: 20px;
        }

        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        thead tr { background-color: var(--primary-header); color: white; }
        th, td { padding: 10px 14px; border: 1px solid var(--border-color); }
        tbody tr:nth-child(even) { background-color: #fafafa; }
        tbody tr:hover { background-color: #f1f8e9; }

        .tag-class { background: #e8f5e9; color: #1b4d3e; padding: 2px 8px; border-radius: 4px; font-weight: 700; font-size: 12px; border: 1px solid #c8e6c9; }
        .tag-subject { background: #e0f2fe; color: #0369a1; padding: 2px 8px; border-radius: 4px; font-weight: 600; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <header class="page-header">
        <h1 class="page-title"><i class="fa-solid fa-graduation-cap"></i> QUẢN LÝ LỊCH HỌC & TRỢ GIẢNG</h1>
    </header>

    <!-- BỘ LỌC DỮ LIỆU -->
    <div class="filter-panel">
        <div class="filter-group">
            <label><i class="fa-regular fa-calendar"></i> THỨ:</label>
            <select id="daySelect" class="filter-control" onchange="onFilterChange()">
                <option value="ALL">-- Tất cả các Thứ --</option>
                <option value="I">Thứ 2 (Cột I)</option>
                <option value="R">Thứ 3 (Cột R)</option>
                <option value="AA">Thứ 4 (Cột AA)</option>
                <option value="AJ">Thứ 5 (Cột AJ)</option>
                <option value="AS">Thứ 6 (Cột AS)</option>
                <option value="BB">Chủ Nhật (Cột BB)</option>
            </select>
        </div>

        <div class="filter-group">
            <label><i class="fa-solid fa-book"></i> MÔN HỌC:</label>
            <select id="subjectSelect" class="filter-control" onchange="onFilterChange()">
                <option value="ALL">-- Tất cả môn --</option>
                <option value="Toán">Toán</option>
                <option value="Lí">Vật Lí</option>
            </select>
        </div>

        <div class="filter-group">
            <label><i class="fa-solid fa-users"></i> LỚP / KHỐI:</label>
            <select id="classSelect" class="filter-control" onchange="onFilterChange()">
                <option value="ALL">-- Tất cả lớp --</option>
                <!-- Khối 12 -->
                <option value="T12">T12</option>
                <option value="L12">L12</option>
                <option value="TL12">TL12</option>
                <!-- Khối 11 -->
                <option value="T11">T11</option>
                <option value="L11">L11</option>
                <option value="TL11">TL11</option>
                <!-- Khối 10 -->
                <option value="T10">T10</option>
                <option value="L10">L10</option>
                <option value="TL10">TL10</option>
                <!-- Khối 9 -->
                <option value="T9">T9</option>
                <option value="L9">L9</option>
                <option value="TL9">TL9</option>
                <!-- Khối 8 -->
                <option value="T8">T8</option>
                <option value="L8">L8</option>
                <option value="TL8">TL8</option>
                <!-- Khối 7 -->
                <option value="T7">T7</option>
                <option value="L7">L7</option>
                <option value="TL7">TL7</option>
                <!-- Khối 6 -->
                <option value="T6">T6</option>
                <option value="L6">L6</option>
                <option value="TL6">TL6</option>
            </select>
        </div>

        <div class="filter-group">
            <label><i class="fa-solid fa-magnifying-glass"></i> TÌM TÊN:</label>
            <input type="text" id="searchInput" class="filter-control" placeholder="Nhập tên..." oninput="onFilterChange()">
        </div>

        <button class="btn-reset" onclick="resetFilters()"><i class="fa-solid fa-rotate-left"></i> Đặt lại</button>
    </div>

    <!-- BẢNG 1: TRỢ GIẢNG (Ẩn mặc định, chỉ hiện khi người dùng lọc) -->
    <div id="troGiangSection" style="display: none;">
        <div class="section-header">
            <div class="section-title"><i class="fa-solid fa-user-tie" style="color: #0369a1;"></i> DANH SÁCH TRỢ GIẢNG</div>
            <span id="tgCount" class="badge-count">0</span>
        </div>
        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th style="width: 50px;">STT</th>
                        <th>Họ và Tên Trợ Giảng</th>
                        <th>Trạng Thái Lịch Trực</th>
                    </tr>
                </thead>
                <tbody id="tgTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- BẢNG 2: HỌC SINH -->
    <div id="hocSinhSection">
        <div class="section-header">
            <div class="section-title"><i class="fa-solid fa-user-graduate" style="color: #1b4d3e;"></i> DANH SÁCH HỌC SINH</div>
            <span id="hsCount" class="badge-count">0</span>
        </div>
        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th style="width: 50px;">STT</th>
                        <th>Họ và Tên Học Sinh</th>
                        <th>Lớp (Cột D)</th>
                        <th>Môn Học (Tự bóc tách)</th>
                    </tr>
                </thead>
                <tbody id="hsTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Dữ liệu Trợ Giảng (Tương ứng hàng 4 - 11)
    const rawTroGiang = [
        { ho: '', ten: 'Chi', schedule: { I:1, R:1, AA:1, AJ:1, AS:1, BB:1 } },
        { ho: 'Bình', ten: 'Anh', schedule: { I:1, R:1, AA:1, AJ:1, AS:1, BB:1 } },
        { ho: 'Tường', ten: 'Duy', schedule: { I:1, R:1, AA:1, AJ:1, AS:1, BB:1 } },
        { ho: 'Hoàng', ten: 'Đức', schedule: { I:1, R:1, AA:1, AJ:1, AS:1, BB:1 } },
        { ho: 'Đức', ten: 'Huy', schedule: { I:1, R:1, AA:1, AJ:1, AS:1, BB:1 } },
        { ho: 'Quang', ten: 'Anh', schedule: { I:1, R:1, AA:1, AJ:1, AS:1, BB:1 } },
        { ho: 'Ngọc', ten: 'Nam', schedule: { I:1, R:1, AA:1, AJ:1, AS:1, BB:1 } },
        { ho: 'Thùy', ten: 'Linh', schedule: { I:1, R:1, AA:1, AJ:1, AS:1, BB:1 } }
    ];

    // Dữ liệu Học Sinh mẫu phủ đầy đủ các khối lớp từ 6 đến 12
    const rawHocSinh = [
        { ho: 'Lâm (2001)', ten: 'Hải', lopRaw: 'T12', schedule: { I:1, R:0, AA:1, AJ:0, AS:0, BB:0 } },
        { ho: 'Bá', ten: 'Huy', lopRaw: 'L12', schedule: { I:1, R:0, AA:0, AJ:0, AS:0, BB:0 } },
        { ho: 'Châu', ten: 'Giang', lopRaw: 'TL12', schedule: { I:1, R:0, AA:0, AJ:0, AS:0, BB:0 } },
        { ho: 'Nguyễn Văn', ten: 'An', lopRaw: 'T11', schedule: { I:1, R:1, AA:0, AJ:0, AS:0, BB:0 } },
        { ho: 'Trần Thị', ten: 'Bích', lopRaw: 'TL11', schedule: { I:0, R:1, AA:1, AJ:0, AS:0, BB:0 } },
        { ho: 'Phạm Minh', ten: 'Đức', lopRaw: 'L11', schedule: { I:1, R:0, AA:1, AJ:0, AS:0, BB:0 } },
        { ho: 'Lê Hoàng', ten: 'Nam', lopRaw: 'T10', schedule: { I:0, R:0, AA:1, AJ:1, AS:0, BB:0 } },
        { ho: 'Vũ Quốc', ten: 'Bảo', lopRaw: 'TL10', schedule: { I:1, R:0, AA:0, AJ:1, AS:0, BB:0 } },
        { ho: 'Đặng Ngọc', ten: 'Ánh', lopRaw: 'L10', schedule: { I:0, R:1, AA:0, AJ:0, AS:1, BB:0 } },
        { ho: 'Hoàng Văn', ten: 'Cường', lopRaw: 'T9', schedule: { I:1, R:0, AA:1, AJ:0, AS:0, BB:0 } },
        { ho: 'Bùi Thị', ten: 'Dung', lopRaw: 'TL9', schedule: { I:0, R:1, AA:0, AJ:1, AS:0, BB:0 } },
        { ho: 'Đỗ Tiến', ten: 'Đạt', lopRaw: 'T8', schedule: { I:1, R:0, AA:0, AJ:0, AS:1, BB:0 } },
        { ho: 'Nghiêm Xuân', ten: 'Hùng', lopRaw: 'TL8', schedule: { I:0, R:1, AA:1, AJ:0, AS:0, BB:0 } },
        { ho: 'Ngô Thanh', ten: 'Hương', lopRaw: 'T7', schedule: { I:1, R:0, AA:0, AJ:1, AS:0, BB:0 } },
        { ho: 'Trịnh Quốc', ten: 'Khánh', lopRaw: 'TL7', schedule: { I:0, R:0, AA:1, AJ:0, AS:1, BB:0 } },
        { ho: 'Phan Văn', ten: 'Lâm', lopRaw: 'T6', schedule: { I:1, R:1, AA:0, AJ:0, AS:0, BB:0 } },
        { ho: 'Lương Thu', ten: 'Trang', lopRaw: 'TL6', schedule: { I:0, R:0, AA:1, AJ:1, AS:0, BB:0 } }
    ];

    // Thuật toán bóc tách Môn học từ Cột D (Chứa 'T' -> Toán, 'L' -> Vật Lí, chứa cả 2 -> Toán & Vật Lí)
    function parseSubject(code) {
        if (!code) return 'Chưa xếp';
        let subjects = [];
        if (code.includes('T')) subjects.push('Toán');
        if (code.includes('L')) subjects.push('Vật Lí');
        return subjects.join(' & ') || 'Khác';
    }

    // Khởi tạo bảng ngay khi load trang
    document.addEventListener('DOMContentLoaded', () => {
        onFilterChange();
    });

    // Hàm xử lý lọc dữ liệu
    function onFilterChange() {
        const day = document.getElementById('daySelect').value;
        const subject = document.getElementById('subjectSelect').value;
        const className = document.getElementById('classSelect').value;
        const search = document.getElementById('searchInput').value.toLowerCase().trim();

        const isFiltering = (day !== 'ALL' || subject !== 'ALL' || className !== 'ALL' || search !== '');

        // 1. TRỢ GIẢNG: Chỉ hiện khi thực hiện lọc
        const tgSection = document.getElementById('troGiangSection');
        if (isFiltering) {
            tgSection.style.display = 'block';
            const filteredTG = rawTroGiang.filter(item => {
                const fullName = `${item.ho} ${item.ten}`.toLowerCase();
                if (search && !fullName.includes(search)) return false;
                if (day !== 'ALL' && !item.schedule[day]) return false;
                return true;
            });
            renderTGTable(filteredTG);
        } else {
            tgSection.style.display = 'none';
        }

        // 2. HỌC SINH: Lọc theo điều kiện Chọn Lớp, Môn, Thứ, Tên
        const filteredHS = rawHocSinh.filter(item => {
            const fullName = `${item.ho} ${item.ten}`.toLowerCase();
            const monHoc = parseSubject(item.lopRaw);

            if (search && !fullName.includes(search)) return false;
            if (day !== 'ALL' && !item.schedule[day]) return false;
            if (className !== 'ALL' && item.lopRaw !== className) return false;
            if (subject !== 'ALL' && !monHoc.includes(subject)) return false;

            return true;
        });

        renderHSTable(filteredHS);
    }

    // Render Bảng Trợ Giảng
    function renderTGTable(data) {
        const tbody = document.getElementById('tgTableBody');
        document.getElementById('tgCount').innerText = data.length;
        tbody.innerHTML = '';

        if (data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#888;">Không có trợ giảng phù hợp</td></tr>`;
            return;
        }

        data.forEach((item, index) => {
            const fullName = `${item.ho} ${item.ten}`.trim();
            tbody.innerHTML += `
                <tr>
                    <td>${index + 1}</td>
                    <td><strong>${fullName}</strong></td>
                    <td><span style="color: #2e7d32; font-weight:600;"><i class="fa-solid fa-circle-check"></i> Có ca trực</span></td>
                </tr>
            `;
        });
    }

    // Render Bảng Học Sinh
    function renderHSTable(data) {
        const tbody = document.getElementById('hsTableBody');
        document.getElementById('hsCount').innerText = data.length;
        tbody.innerHTML = '';

        if (data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#888;">Không tìm thấy học sinh phù hợp</td></tr>`;
            return;
        }

        data.forEach((item, index) => {
            const fullName = `${item.ho} ${item.ten}`.trim();
            const monHoc = parseSubject(item.lopRaw);
            const lopDisplay = item.lopRaw ? `<span class="tag-class">${item.lopRaw}</span>` : '<span style="color:#aaa;">Chưa xếp</span>';

            tbody.innerHTML += `
                <tr>
                    <td>${index + 1}</td>
                    <td><strong>${fullName}</strong></td>
                    <td>${lopDisplay}</td>
                    <td><span class="tag-subject">${monHoc}</span></td>
                </tr>
            `;
        });
    }

    // Đặt lại bộ lọc
    function resetFilters() {
        document.getElementById('daySelect').value = 'ALL';
        document.getElementById('subjectSelect').value = 'ALL';
        document.getElementById('classSelect').value = 'ALL';
        document.getElementById('searchInput').value = '';
        onFilterChange();
    }
</script>

</body>
</html>
