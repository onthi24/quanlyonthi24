<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài giảng Toán 12 - ONTHI24.COM</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        .content-card {
            background: #ffffff;
            width: 100%;
            max-width: 900px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-left: 4px solid #166534;
            padding-left: 12px;
        }

        .card-header h2 {
            font-size: 1.15rem;
            color: #1e293b;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .fullscreen-btn {
            background-color: #166534;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .fullscreen-btn:hover {
            background-color: #14532d;
        }

        .pdf-viewer-container {
            width: 100%;
            height: 650px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            overflow: hidden;
            background: #f1f5f9;
            position: relative; /* Cực kỳ quan trọng để neo lớp phủ */
        }

        .pdf-viewer-container embed {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* --- LỚP PHỦ CSS ĐỂ CHE NÚT GOOGLE DRIVE --- */
        .hide-drive-btn {
            position: absolute;
            top: 0;
            right: 0;
            width: 60px;   /* Độ rộng che trùm nút */
            height: 50px;  /* Chiều cao che trùm nút */
            background-color: #ffffff; /* Đồng bộ màu nền góc trên bên phải của khung PDF */
            z-index: 10;   /* Nằm đè lên trên thẻ embed */
            pointer-events: auto; /* Chặn hoàn toàn thao tác click chuột vào nút bên dưới */
        }
    </style>
</head>
<body>

    <div class="content-card" id="pdf-card">
        <div class="card-header">
            <h2>Nội dung bài học: Bài 3. Đường tiệm cận của đồ thị hàm số</h2>
            <button class="fullscreen-btn" onclick="toggleFullScreen()">
                ⛶ Phóng to toàn màn hình
            </button>
        </div>

        <div class="pdf-viewer-container" id="fullscreen-target">
            <!-- Lớp mặt nạ che khuất nút mở rộng của Google Drive -->
            <div class="hide-drive-btn"></div>
            
            <!-- Thẻ hiển thị PDF -->
            <embed src="https://drive.google.com/file/d/1HDtN3iK6_o1pufpNkmk33Lm294WHZiD_/preview" type="application/pdf">
        </div>
    </div>

    <script>
        function toggleFullScreen() {
            var elem = document.getElementById("pdf-card");
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }
    </script>

</body>
</html>
