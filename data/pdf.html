<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài giảng Toán 12 - ONTHI24.COM</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        /* Khung chứa chính (Card giao diện) */
        .content-card {
            background: #ffffff;
            width: 100%;
            max-width: 900px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        /* Tiêu đề mục */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-left: 4px solid #166534;
            padding-left: 12px;
        }

        .card-header h2 {
            font-size: 1.15rem;
            color: #1e293b;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Nút bấm Toàn màn hình tùy chỉnh */
        .fullscreen-btn {
            background-color: #166534;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .fullscreen-btn:hover {
            background-color: #14532d;
        }

        /* Khung hiển thị PDF bọc bên trong */
        .pdf-viewer-container {
            width: 100%;
            height: 650px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            overflow: hidden;
            background: #f1f5f9;
            position: relative;
        }

        /* Thẻ embed hiển thị PDF sạch sẽ, không lộ link gốc Drive */
        .pdf-viewer-container embed {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="content-card" id="pdf-card">
        <!-- Tiêu đề và nút bấm Fullscreen -->
        <div class="card-header">
            <h2>Nội dung bài học: Bài 3. Đường tiệm cận của đồ thị hàm số</h2>
            <button class="fullscreen-btn" onclick="toggleFullScreen()">
                ⛶ Phóng to toàn màn hình
            </button>
        </div>

        <!-- Khung chứa tài liệu PDF -->
        <div class="pdf-viewer-container" id="fullscreen-target">
            <!-- Dùng link preview của Google Drive gắn vào thẻ embed -->
            <script>
                // Tự động gán link để tránh lộ trực tiếp hoặc dễ quản lý
                document.write('<embed src="https://drive.google.com/file/d/1HDtN3iK6_o1pufpNkmk33Lm294WHZiD_/preview" type="application/pdf">');
            </script>
        </div>
    </div>

    <script>
        // Hàm kích hoạt chế độ toàn màn hình cho khung bài giảng
        function toggleFullScreen() {
            var elem = document.getElementById("pdf-card");
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) { /* Safari */
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) { /* IE11 */
                    elem.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) { /* Safari */
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) { /* IE11 */
                    document.msExitFullscreen();
                }
            }
        }
    </script>

</body>
</html>
