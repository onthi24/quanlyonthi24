<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Nhập & Quản Lý Dữ Liệu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #1a4d2e;
            --secondary-color: #f4f6f9;
            --text-color: #333;
            --border-color: #e2e8f0;
            --btn-blue: #2563eb;
            --btn-blue-hover: #1d4ed8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #ffffff; color: var(--text-color); padding: 20px; font-size: 15px; }
        .container { max-width: 1400px; margin: 0 auto; }

        .header-title { text-align: center; color: var(--primary-color); margin-bottom: 25px; font-size: 22px; text-transform: uppercase; font-weight: 700; }

        /* MAIN LAYOUT */
        .main-layout { display: flex; gap: 20px; flex-wrap: wrap; }
        
        /* LEFT PANEL (Form nhập - giữ nguyên không gian) */
        .left-panel { flex: 1; min-width: 320px; background: var(--secondary-color); padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); height: fit-content; }
        .left-panel h3 { color: var(--primary-color); margin-bottom: 15px; font-size: 18px; border-bottom: 2px solid var(--primary-color); padding-bottom: 8px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 500; margin-bottom: 5px; font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e0; outline: none; font-size: 14px; background: white; }

        /* RIGHT PANEL (Bảng dữ liệu và Bộ lọc theo yêu cầu) */
        .right-panel { flex: 3; min-width: 600px; background: var(--secondary-color); padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); }
        .right-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: #1a4d2e; color: white; padding: 10px 15px; border-radius: 6px; }
        
        /* FILTER SECTION */
        .filter-section { display: flex; gap: 10px; margin-bottom: 15px; background: #ffffff; padding: 12px; border-radius: 6px; align-items: center; flex-wrap: wrap; border: 1px solid var(--border-color); }
        .filter-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 130px; }
        .filter-group label { font-weight: 600; color: #4a5568; font-size: 12px; }
        .filter-group input, .filter-group select { padding: 7px 10px; border-radius: 6px; border: 1px solid #cbd5e0; font-size: 13px; outline: none; background: white; }
        
        .btn-update { background-color: var(--btn-blue); color: #ffffff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; height: 35px; align-self: flex-end; }
        .btn-update:hover { background-color: var(--btn-blue-hover); }

        /* TABLE */
        .table-responsive { overflow-x: auto; background: white; border-radius: 6px; border: 1px solid var(--border-color); }
        table { width: 100%; border-collapse: collapse; }
        thead { background-color: var(--primary-color); color: white; }
        th, td { padding: 12px 15px; border-bottom: 1px solid var(--border-color); font-size: 13px; text-align: left; }
        th { font-weight: 600; text-transform: uppercase; font-size: 12px; }
        tbody tr:hover { background-color: #f1f5f9; }
        .empty-message { text-align: center; padding: 25px; color: #718096; font-style: italic; }
        #loading { text-align: center; padding: 15px; color: var(--primary-color); font-weight: bold; font-size: 14px; display: none; }
        .total-records { margin-top: 10px; font-size: 13px; color: #4a5568; font-weight: 500; }

        @media (max-width: 992px) {
            .main-layout { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 class="header-title"><i class="fa-solid fa-calculator"></i> HỆ THỐNG NHẬP & QUẢN LÝ DỮ LIỆU</h2>

        <div class="main-layout">
            <!-- PHẦN BÊN TRÁI: GIỮ NGUYÊN FORM NHẬP -->
            <div class="left-panel">
                <h3>Nhập dữ liệu mới</h3>
                <div class="form-group">
                    <label>Họ và tên *</label>
                    <input type="text" placeholder="Nhập họ và tên...">
                </div>
                <div class="form-group">
                    <label>Ngày sinh *</label>
                    <input type="date">
                </div>
                <div class="form-group">
                    <label>Tháng *</label>
                    <select>
                        <option value="">-- Chọn tháng --</option>
                        <option value="1">Tháng 1</option>
                        <option value="2">Tháng 2</option>
                        <option value="3">Tháng 3</option>
                    </select>
                </div>
            </div>

            <!-- PHẦN BÊN PHẢI: LỌC VÀ HIỂN THỊ DỮ LIỆU THEO YÊU CẦU -->
            <div class="right-panel">
                <div class="right-header">
                    <span><i class="fa-solid fa-list"></i> DANH SÁCH DỮ LIỆU</span>
                    <span id="sync-status" style="font-size: 12px; color: #fde047;">Đang sẵn sàng</span>
                </div>

                <!-- BỘ LỌC ĐÚNG LUỒNG YÊU CẦU -->
                <div class="filter-section">
                    <!-- 1. Chọn Tên (Cột B) có gợi ý -->
                    <div class="filter-group">
                        <label for="filter-name">Họ và Tên</label>
                        <input type="text" id="filter-name" list="name-list" placeholder="Gõ chọn tên..." oninput="onNameChange()">
                        <datalist id="name-list"></datalist>
                    </div>

                    <!-- 2. Chọn Ngày tháng năm (Cột C) đối chiếu -->
                    <div class="filter-group">
                        <label for="filter-date">Ngày sinh / Ngày</label>
                        <input type="date" id="filter-date" onchange="onDateChange()" disabled>
                    </div>

                    <!-- 3. Chọn Môn (Toán, Lí hoặc cả 2) -->
                    <div class="filter-group">
                        <label for="filter-subject">Môn học</label>
                        <select id="filter-subject" onchange="applyFilter()" disabled>
                            <option value="ALL">-- Tất cả môn --</option>
                            <option value="Toán">Toán</option>
                            <option value="Lí">Lí</option>
                            <option value="Toán-Lí">Cả Toán và Lí</option>
                        </select>
                    </div>

                    <!-- 4. Chọn Tháng (Cột D) -->
                    <div class="filter-group">
                        <label for="filter-month">Tháng</label>
                        <select id="filter-month" onchange="applyFilter()" disabled>
                            <option value="ALL">-- Tất cả tháng --</option>
                        </select>
                    </div>

                    <button class="btn-update" onclick="fetchDataFromSheet()">
                        <i class="fa-solid fa-rotate"></i> Cập nhật
                    </button>
                </div>

                <div id="loading"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải dữ liệu từ Google Sheet...</div>

                <!-- BẢNG HIỂN THỊ KẾT QUẢ -->
                <div class="table-responsive">
                    <table id="data-table">
                        <thead>
                            <tr>
                                <th>STT</th>
                                <th>HỌ VÀ TÊN</th>
                                <th>NGÀY SINH</th>
                                <th>THÁNG</th>
                                <th>MÔN</th>
                                <th>ĐIỂM</th>
                                <th>NGÀY NHẬP</th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                            <tr><td colspan="7" class="empty-message">Vui lòng chọn tên và xác thực ngày tháng để xem dữ liệu</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="total-records">Tổng số: <span id="record-count">0</span> bản ghi</div>
            </div>
        </div>
    </div>

    <script>
        // Link Google Sheet cấu hình theo yêu cầu của thầy
        const SHEET_ID = "1IksY8q7pq7Y0Mi1QWV-qkdIHdBzlp2GTWx_t5JuCBUI";
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=939986110`;
        const CACHE_KEY = "custom_sheet_data_cache";

        let allData = [];

        window.onload = function() {
            const cached = localStorage.getItem(CACHE_KEY);
            if (cached) {
                try {
                    allData = JSON.parse(cached);
                    populateNameList();
                } catch(e) { console.error(e); }
            }
            fetchDataFromSheet();
        };

        // Hàm xử lý đọc file CSV đơn giản
        function parseCSVLine(text) {
            let result = [], entry = '', inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                if (inQuotes) {
                    if (c === '"') {
                        if (i + 1 < text.length && text[i + 1] === '"') { entry += '"'; i++; }
                        else { inQuotes = false; }
                    } else { entry += c; }
                } else {
                    if (c === '"') { inQuotes = true; }
                    else if (c === ',') { result.push(entry); entry = ''; }
                    else { entry += c; }
                }
            }
            result.push(entry);
            return result;
        }

        function cleanText(str) {
            if (!str) return '';
            return String(str).replace(/^["'\s]+|["'\s]+$/g, '').trim();
        }

        // Tải dữ liệu từ Google Sheet
        function fetchDataFromSheet() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('sync-status').innerText = 'Đang đồng bộ...';

            fetch(CSV_URL)
                .then(res => res.text())
                .then(text => {
                    let lines = text.split(/\r?\n/);
                    let parsed = [];

                    // Giả định dữ liệu bắt đầu từ dòng thứ 2 (bỏ qua tiêu đề cột)
                    for (let i = 1; i < lines.length; i++) {
                        if (!lines[i].trim()) continue;
                        let cols = parseCSVLine(lines[i]);
                        
                        if (cols.length >= 6) {
                            parsed.push({
                                stt: cleanText(cols[0]),
                                name: cleanText(cols[1]),     // Cột B: Tên
                                dateVal: cleanText(cols[2]),  // Cột C: Ngày tháng
                                monthVal: cleanText(cols[3]), // Cột D: Tháng
                                subject: cleanText(cols[4]),  // Cột E: Môn
                                score: cleanText(cols[5]),    // Cột F: Điểm
                                createdDate: cleanText(cols[6]) || '' // Cột G (nếu có)
                            });
                        }
                    }

                    allData = parsed;
                    localStorage.setItem(CACHE_KEY, JSON.stringify(allData));
                    
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('sync-status').innerText = 'Đã cập nhật mới nhất';
                    populateNameList();
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('sync-status').innerText = 'Lỗi kết nối Sheet';
                });
        }

        // Đổ dữ liệu gợi ý vào ô chọn Tên (Cột B)
        function populateNameList() {
            const datalist = document.getElementById('name-list');
            datalist.innerHTML = '';
            let uniqueNames = [...new Set(allData.map(item => item.name))].filter(Boolean);

            uniqueNames.sort((a,b) => a.localeCompare(b, 'vi')).forEach(name => {
                let opt = document.createElement('option');
                opt.value = name;
                datalist.appendChild(opt);
            });
        }

        // Bước 1: Khi người dùng chọn/nhập tên -> Mở khóa ô chọn Ngày
        function onNameChange() {
            let nameInput = document.getElementById('filter-name').value.trim();
            let dateInput = document.getElementById('filter-date');
            let subjectSelect = document.getElementById('filter-subject');
            let monthSelect = document.getElementById('filter-month');

            if (nameInput) {
                dateInput.disabled = false; // Kích hoạt ô ngày
            } else {
                dateInput.disabled = true;
                subjectSelect.disabled = true;
                monthSelect.disabled = true;
                dateInput.value = '';
                resetDropdowns();
                clearTable();
            }
        }

        // Bước 2: Khi chọn Ngày -> Đối chiếu với Cột C, nếu đúng cho nhập tiếp Môn & Tháng
        function onDateChange() {
            let nameInput = document.getElementById('filter-name').value.trim();
            let selectedDate = document.getElementById('filter-date').value;
            let subjectSelect = document.getElementById('filter-subject');
            let monthSelect = document.getElementById('filter-month');

            // Kiểm tra xem tên và ngày có khớp với cơ sở dữ liệu không
            let matchFound = allData.some(item => 
                item.name.toLowerCase() === nameInput.toLowerCase() && 
                item.dateVal.includes(selectedDate)
            );

            if (matchFound && selectedDate) {
                subjectSelect.disabled = false;
                monthSelect.disabled = false;
                populateMonths(nameInput);
                applyFilter();
            } else {
                alert("Ngày tháng không khớp với dữ liệu của người này trong hệ thống!");
                subjectSelect.disabled = true;
                monthSelect.disabled = true;
                clearTable();
            }
        }

        // Nạp danh sách tháng tương ứng của người dùng từ Cột D
        function populateMonths(name) {
            const monthSelect = document.getElementById('filter-month');
            monthSelect.innerHTML = '<option value="ALL">-- Tất cả tháng --</option>';
            
            let months = [...new Set(allData.filter(i => i.name.toLowerCase() === name.toLowerCase()).map(i => i.monthVal))].filter(Boolean);
            
            months.sort().forEach(m => {
                let opt = document.createElement('option');
                opt.value = m;
                opt.textContent = "Tháng " + m;
                monthSelect.appendChild(opt);
            });
        }

        // Bước 3 & 4: Lọc và hiển thị toàn bộ thông tin lên bảng
        function applyFilter() {
            let nameInput = document.getElementById('filter-name').value.trim().toLowerCase();
            let selectedDate = document.getElementById('filter-date').value;
            let selectedSubject = document.getElementById('filter-subject').value;
            let selectedMonth = document.getElementById('filter-month').value;

            let filtered = allData.filter(item => {
                let matchName = !nameInput || item.name.toLowerCase().includes(nameInput);
                let matchDate = !selectedDate || item.dateVal.includes(selectedDate);
                
                // Lọc Môn (Toán, Lí hoặc chọn cả 2)
                let matchSubject = true;
                if (selectedSubject !== "ALL") {
                    if (selectedSubject === "Toán-Lí") {
                        matchSubject = item.subject.toLowerCase().includes("toán") || item.subject.toLowerCase().includes("lí");
                    } else {
                        matchSubject = item.subject.toLowerCase().includes(selectedSubject.toLowerCase());
                    }
                }

                let matchMonth = (selectedMonth === "ALL") || (item.monthVal === selectedMonth);

                return matchName && matchDate && matchSubject && matchMonth;
            });

            renderTable(filtered);
        }

        function renderTable(data) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            document.getElementById('record-count').innerText = data.length;

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty-message">Không tìm thấy dữ liệu phù hợp</td></tr>';
                return;
            }

            data.forEach((item, index) => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-weight: bold; text-align: center;">${index + 1}</td>
                    <td style="font-weight: bold; color: var(--primary-color);">${item.name}</td>
                    <td style="text-align: center;">${item.dateVal}</td>
                    <td style="text-align: center;">${item.monthVal}</td>
                    <td style="text-align: center; font-weight: bold;">${item.subject}</td>
                    <td style="text-align: center; color: #2563eb; font-weight: bold;">${item.score}</td>
                    <td style="text-align: center; color: #555;">${item.createdDate}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function clearTable() {
            document.getElementById('table-body').innerHTML = '<tr><td colspan="7" class="empty-message">Vui lòng hoàn tất các bước chọn lọc</td></tr>';
            document.getElementById('record-count').innerText = "0";
        }

        function resetDropdowns() {
            document.getElementById('filter-subject').value = "ALL";
            document.getElementById('filter-month').innerHTML = '<option value="ALL">-- Tất cả tháng --</option>';
        }
    </script>
</body>
</html>
