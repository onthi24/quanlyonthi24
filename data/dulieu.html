<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Nhập & Quản Lý Dữ Liệu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #1a4d2e;
            --primary-hover: #133a22;
            --secondary-color: #f4f6f9;
            --text-color: #333;
            --border-color: #e2e8f0;
            --accent-color: #2563eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f8fafc;
            color: var(--text-color);
            padding: 20px;
            font-size: 15px;
        }

        .container { max-width: 1300px; margin: 0 auto; }

        .header-title {
            text-align: center; color: var(--primary-color); margin-bottom: 25px;
            font-size: 22px; text-transform: uppercase; font-weight: 700;
        }

        /* Bố cục chia 2 cột */
        .main-layout {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 20px;
            align-items: start;
        }

        /* --- FORM NHẬP DỮ LIỆU CHUYÊN NGHIỆP --- */
        .custom-form-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .card-header {
            background-color: var(--primary-color);
            color: white;
            padding: 16px 20px;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: #4a5568;
            text-transform: uppercase;
        }

        .form-group label span {
            color: #e53e3e;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 12px;
            color: #a0aec0;
            font-size: 14px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 10px 12px 10px 36px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .input-wrapper input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(26, 77, 46, 0.15);
        }

        .btn-submit {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 5px;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-submit:disabled {
            background-color: #a0aec0;
            cursor: not-allowed;
        }

        /* --- BẢNG HIỂN THỊ DỮ LIỆU --- */
        .data-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border-color);
        }

        .filter-section {
            display: flex; gap: 15px; margin-bottom: 15px; background: var(--secondary-color);
            padding: 12px; border-radius: 8px; align-items: center;
        }

        .search-box { flex: 1; position: relative; }
        .search-box input {
            width: 100%; padding: 10px 12px 10px 35px; border-radius: 6px;
            border: 1px solid #cbd5e0; outline: none; font-size: 14px;
        }
        .search-box i {
            position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #718096;
        }

        .btn-refresh {
            background-color: var(--accent-color); color: white; border: none; padding: 10px 16px;
            border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; gap: 8px; font-size: 14px;
        }
        .btn-refresh:hover { background-color: #1d4ed8; }

        .table-responsive { 
            overflow-x: auto; 
            border-radius: 8px;
            max-height: 520px;
            overflow-y: auto;
        }
        
        table { width: 100%; border-collapse: collapse; background-color: white; }
        thead { background-color: var(--primary-color); color: white; position: sticky; top: 0; z-index: 10; }
        th, td { padding: 12px 15px; border-bottom: 1px solid var(--border-color); }
        th { font-weight: 600; text-transform: uppercase; font-size: 13px; letter-spacing: 0.5px; text-align: center; }
        
        td { font-size: 14px; line-height: 1.5; }
        td.text-center { text-align: center; }
        td.text-right { text-align: right; }
        td.font-weight-bold { font-weight: 600; }

        tbody tr:nth-child(even) { background-color: #fbfbfb; }
        tbody tr:hover { background-color: #f1f5f9; }

        .empty-message { text-align: center; padding: 40px; color: #718096; font-style: italic; }

        /* Màn hình nhỏ */
        @media (max-width: 992px) {
            .main-layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 class="header-title"><i class="fa-solid fa-calculator"></i> HỆ THỐNG NHẬP & QUẢN LÝ DỮ LIỆU</h2>

        <div class="main-layout">
            <!-- CỘT 1: FORM NHẬP DỮ LIỆU ĐỒNG BỘ NATIVE -->
            <div class="custom-form-card">
                <div class="card-header">
                    <i class="fa-solid fa-pen-to-square"></i> NHẬP DỮ LIỆU MỚI
                </div>
                
                <form id="native-form" class="form-body" onsubmit="submitToGoogleForm(event)">
                    <div class="form-group">
                        <label>Họ và tên <span>*</span></label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-user"></i>
                            <input type="text" id="input-fullname" placeholder="Nhập họ và tên..." required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Số tiền <span>*</span></label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-money-bill-wave"></i>
                            <input type="number" id="input-amount" placeholder="Nhập số tiền..." required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Ngày tháng <span>*</span></label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-calendar-days"></i>
                            <input type="date" id="input-date" required>
                        </div>
                    </div>

                    <button type="submit" id="btn-submit-form" class="btn-submit">
                        <i class="fa-solid fa-paper-plane"></i> Gửi dữ liệu
                    </button>
                </form>
            </div>

            <!-- CỘT 2: BẢNG HIỂN THỊ DỮ LIỆU -->
            <div class="data-card">
                <div class="filter-section">
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="search-input" placeholder="Tìm kiếm theo Họ và tên..." oninput="applyFilter()">
                    </div>
                    <button class="btn-refresh" onclick="forceReloadData()">
                        <i class="fa-solid fa-rotate"></i> Cập nhật dữ liệu
                    </button>
                </div>

                <div class="table-responsive">
                    <table id="data-table">
                        <thead>
                            <tr>
                                <th style="width: 50px;">STT</th>
                                <th style="text-align: left;">Họ và tên</th>
                                <th style="width: 140px; text-align: right;">Số tiền</th>
                                <th style="width: 130px;">Ngày tháng</th>
                                <th style="width: 160px;">Ngày nhập</th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                            <tr><td colspan="5" class="empty-message">Đang tải dữ liệu...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Frame ẩn dùng để nhận phản hồi từ Google Form gửi ngầm -->
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

    <script>
        const SHEET_ID = "1zs6MS_f_4GA-to9T6MhNQPVzQjKHpXCpyFyjGIf0rtg";
        const SHEET_NAME = "Câu trả lời biểu mẫu 1";
        const CACHE_KEY = "FORM_RESPONSES_DATA_CACHE";
        
        // URL Form Response và ID Entry tương ứng
        const FORM_ACTION_URL = "https://docs.google.com/forms/d/e/1FAIpQLSfrAaemoCg4hfNpLPVoGug2NTufd_AUszC0psGIGsmGlz7miA/formResponse";
        const ENTRY_FULLNAME = "entry.1221568864";
        const ENTRY_AMOUNT   = "entry.1706240093";
        const ENTRY_DATE     = "entry.1235948332";

        let allData = [];

        window.onload = function() {
            // Đặt ngày mặc định cho ô Ngày tháng là ngày hôm nay
            document.getElementById('input-date').valueAsDate = new Date();
            loadData();
        };

        // Gửi ngầm Dữ liệu sang Google Form
        function submitToGoogleForm(e) {
            e.preventDefault();

            const fullName = document.getElementById('input-fullname').value.trim();
            const amount   = document.getElementById('input-amount').value.trim();
            const rawDate  = document.getElementById('input-date').value; // yyyy-mm-dd

            if (!fullName || !amount || !rawDate) return;

            const btnSubmit = document.getElementById('btn-submit-form');
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Đang gửi...`;

            // Tạo form ảo để post sang iframe ẩn (tránh bị CORS/chuyển trang)
            const iframeForm = document.createElement('form');
            iframeForm.action = FORM_ACTION_URL;
            iframeForm.method = 'POST';
            iframeForm.target = 'hidden_iframe';

            const fields = [
                { name: ENTRY_FULLNAME, value: fullName },
                { name: ENTRY_AMOUNT,   value: amount },
                { name: ENTRY_DATE,     value: rawDate }
            ];

            fields.forEach(f => {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = f.name;
                input.value = f.value;
                iframeForm.appendChild(input);
            });

            document.body.appendChild(iframeForm);
            iframeForm.submit();
            document.body.removeChild(iframeForm);

            // Tự động khôi phục nút bấm & làm mới dữ liệu sau 1.5 giây
            setTimeout(() => {
                alert("Gửi dữ liệu thành công!");
                document.getElementById('native-form').reset();
                document.getElementById('input-date').valueAsDate = new Date();
                
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Gửi dữ liệu`;
                
                forceReloadData();
            }, 1500);
        }

        // Tải Dữ Liệu
        function parseCSVLine(text) {
            let result = [], entry = '', inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                if (inQuotes) {
                    if (c === '"') {
                        if (i + 1 < text.length && text[i + 1] === '"') { entry += '"'; i++; }
                        else { inQuotes = false; }
                    } else { entry += c; }
                } else {
                    if (c === '"') { inQuotes = true; }
                    else if (c === ',') { result.push(entry); entry = ''; }
                    else { entry += c; }
                }
            }
            result.push(entry);
            return result;
        }

        function loadData() {
            const cachedData = localStorage.getItem(CACHE_KEY);
            if (cachedData) {
                try {
                    allData = JSON.parse(cachedData);
                    renderTable(allData);
                } catch (e) { console.error("Lỗi cache:", e); }
            }
            fetchDataFromSheet();
        }

        function fetchDataFromSheet() {
            const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}&_t=${new Date().getTime()}`;

            fetch(CSV_URL)
                .then(res => res.text())
                .then(text => {
                    let lines = text.split(/\r?\n/);
                    let rawData = [];

                    for (let i = 1; i < lines.length; i++) {
                        if (!lines[i].trim()) continue;
                        let cols = parseCSVLine(lines[i]);

                        let timestamp = cols[0] ? cols[0].trim() : ""; 
                        let fullName  = cols[1] ? cols[1].trim() : "";  
                        let amount    = cols[2] ? cols[2].trim() : "";    
                        let date      = cols[3] ? cols[3].trim() : "";      

                        if (fullName || amount) {
                            rawData.push({
                                inputDate: timestamp,
                                fullName: fullName,
                                amount: amount,
                                date: date
                            });
                        }
                    }

                    const newDataString = JSON.stringify(rawData);
                    if (newDataString !== localStorage.getItem(CACHE_KEY)) {
                        localStorage.setItem(CACHE_KEY, newDataString);
                        allData = rawData;
                        applyFilter();
                    }
                })
                .catch(err => console.error("Lỗi tải Sheet:", err));
        }

        function forceReloadData() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '<tr><td colspan="5" class="empty-message"><i class="fa-solid fa-spinner fa-spin"></i> Đang cập nhật dữ liệu...</td></tr>';
            fetchDataFromSheet();
        }

        function renderTable(dataArray) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            if (dataArray.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty-message">Không tìm thấy dữ liệu phù hợp.</td></tr>';
                return;
            }

            dataArray.forEach((item, index) => {
                let formattedAmount = item.amount;
                let num = parseFloat(item.amount.replace(/[^0-9.-]+/g, ""));
                if (!isNaN(num)) {
                    formattedAmount = num.toLocaleString('vi-VN');
                }

                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="text-center" style="font-weight: bold;">${index + 1}</td>
                    <td class="font-weight-bold">${item.fullName}</td>
                    <td class="text-right font-weight-bold" style="color: #0b694a;">${formattedAmount}</td>
                    <td class="text-center">${item.date}</td>
                    <td class="text-center" style="color: #64748b; font-size: 13px;">${item.inputDate}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function applyFilter() {
            let keyword = document.getElementById('search-input').value.toLowerCase().trim();
            let filtered = allData.filter(item => item.fullName.toLowerCase().includes(keyword));
            renderTable(filtered);
        }
    </script>
</body>
</html>
