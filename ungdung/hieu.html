<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra cứu Dữ liệu</title>
    <!-- Sử dụng Google Fonts (Inter) để giao diện sắc nét, hiện đại -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4A6B5B;      /* Xanh rêu chủ đạo */
            --primary-dark: #3A5447;       /* Xanh rêu đậm (hover) */
            --primary-light: #F4F7F5;      /* Xanh rêu siêu nhạt (nền) */
            --accent-color: #8FA89B;       /* Xanh rêu sáng (viền/nhấn) */
            --text-color: #2C3E35;         /* Màu chữ tối */
            --bg-color: #FAFBF9;           /* Màu nền trang */
            --white: #FFFFFF;
            --border-radius: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            max-width: 750px;
            width: 100%;
            margin: 40px auto;
            background: var(--white);
            padding: 35px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 20px rgba(74, 107, 91, 0.08);
            border-top: 5px solid var(--primary-color);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 25px;
            font-size: 24px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: var(--primary-dark);
        }

        select, input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #D5E1D9;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            background-color: var(--white);
            transition: all 0.3s ease;
        }

        select:focus, input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(74, 107, 91, 0.15);
        }

        #result-container {
            margin-top: 25px;
            background-color: var(--primary-light);
            border: 1px solid #D5E1D9;
            border-radius: 8px;
            padding: 20px;
            display: none;
        }

        .result-item {
            display: flex;
            padding: 10px 0;
            border-bottom: 1px dashed #D5E1D9;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-label {
            font-weight: 600;
            width: 35%;
            color: var(--primary-dark);
        }

        .result-value {
            width: 65%;
            color: var(--text-color);
            word-break: break-word;
        }

        .loading, .error-msg {
            text-align: center;
            padding: 15px;
            font-size: 14px;
            color: #666;
        }

        .error-msg {
            color: #C0392B;
        }

        /* Nút Truy cập ẩn ở cuối màn hình (Kích hoạt bằng phím F2) */
        #access-btn-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .access-btn {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 12px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: background 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .access-btn:hover {
            background-color: var(--primary-dark);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, 10px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Tra cứu Dữ liệu Đám hiếu</h1>
        
        <div class="form-group">
            <label for="sheet-select">Chọn loại dữ liệu:</label>
            <select id="sheet-select">
                <option value="">-- Đang tải danh sách... --</option>
            </select>
        </div>

        <div class="form-group">
            <label for="name-input">Chọn hoặc tìm kiếm tên:</label>
            <input type="text" id="name-input" placeholder="Gõ hoặc chọn tên trong danh sách..." list="name-list" disabled>
            <datalist id="name-list"></datalist>
        </div>

        <div id="result-container"></div>
    </div>

    <!-- Nút Truy cập xuất hiện khi bấm F2 -->
    <div id="access-btn-container">
        <a href="https://docs.google.com/spreadsheets/d/1mieRfJyDsdevYfwMOhzkrg60pOuBtQ_dkzOW7LfAiA8/edit?gid=0#gid=0" target="_blank" class="access-btn">
            🔗 Truy cập Google Sheets gốc
        </a>
    </div>

    <script>
        // Cấu hình ID của Google Sheets
        const SPREADSHEET_ID = "1mieRfJyDsdevYfwMOhzkrg60pOuBtQ_dkzOW7LfAiA8";
        
        let sheetList = []; // Lưu danh sách các sheet lấy từ DS_sheet
        let currentSheetData = []; // Lưu toàn bộ dữ liệu của sheet đang chọn
        let currentHeaders = [];   // Lưu dòng đầu tiên (tiêu đề cột)

        const sheetSelect = document.getElementById('sheet-select');
        const nameInput = document.getElementById('name-input');
        const nameList = document.getElementById('name-list');
        const resultContainer = document.getElementById('result-container');
        const accessBtnContainer = document.getElementById('access-btn-container');

        // Hàm hỗ trợ phân tích cú pháp CSV chuẩn (xử lý dấu phẩy nằm trong ngoặc kép)
        function parseCSV(text) {
            let lines = [];
            let row = [];
            let inQuotes = false;
            let field = '';
            
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                let next = text[i + 1];
                
                if (c === '"') {
                    if (inQuotes && next === '"') {
                        field += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (c === ',' && !inQuotes) {
                    row.push(field.trim());
                    field = '';
                } else if ((c === '\r' || c === '\n') && !inQuotes) {
                    if (c === '\r' && next === '\n') { i++; }
                    row.push(field.trim());
                    if (row.length > 1 || row[0] !== '') {
                        lines.push(row);
                    }
                    row = [];
                    field = '';
                } else {
                    field += c;
                }
            }
            if (field !== '' || row.length > 0) {
                row.push(field.trim());
                lines.push(row);
            }
            return lines;
        }

        // Bước 1: Tải tab "DS_sheet" để lấy danh mục các sheet tùy biến
        async function loadDSsheet() {
            try {
                // gid của DS_sheet theo file của thầy là 1424212256 (hoặc dùng tên sheet nếu export qua gviz, dùng export csv theo tên tab)
                const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=DS_sheet`;
                const response = await fetch(url);
                const data = await response.text();
                const rows = parseCSV(data);

                sheetSelect.innerHTML = '<option value="">-- Chọn loại dữ liệu --</option>';
                sheetList = [];

                // Giả sử dòng 1 là tiêu đề (Tên sheet | Nội dung), bắt đầu duyệt từ dòng 2
                for (let i = 1; i < rows.length; i++) {
                    let sheetName = rows[i][0];
                    let description = rows[i][1];
                    if (sheetName) {
                        sheetList.push(sheetName);
                        let opt = document.createElement('option');
                        opt.value = sheetName;
                        opt.textContent = description ? `${sheetName} (${description})` : sheetName;
                        sheetSelect.appendChild(opt);
                    }
                }
            } catch (error) {
                console.error("Lỗi tải DS_sheet:", error);
                sheetSelect.innerHTML = '<option value="">Lỗi tải danh mục sheet!</option>';
            }
        }

        // Bước 2: Khi người dùng đổi lựa chọn sheet -> Tải dữ liệu của sheet đó
        sheetSelect.addEventListener('change', async function() {
            let selectedSheet = this.value;
            nameInput.value = '';
            nameInput.disabled = true;
            nameList.innerHTML = '';
            resultContainer.style.display = 'none';

            if (!selectedSheet) return;

            nameInput.placeholder = "Đang tải dữ liệu...";

            try {
                const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(selectedSheet)}`;
                const response = await fetch(url);
                const data = await response.text();
                const rows = parseCSV(data);

                if (rows.length === 0) {
                    nameInput.placeholder = "Sheet trống!";
                    return;
                }

                currentHeaders = rows[0]; // Dòng đầu tiên làm tiêu đề
                currentSheetData = rows.slice(1); // Các dòng sau là dữ liệu

                // Nạp gợi ý tên từ cột thứ 2 (cột B - Họ và tên)
                nameList.innerHTML = '';
                currentSheetData.forEach(row => {
                    let name = row[1]; // Cột B
                    if (name) {
                        let option = document.createElement('option');
                        option.value = name;
                        nameList.appendChild(option);
                    }
                });

                nameInput.disabled = false;
                nameInput.placeholder = "Gõ hoặc chọn tên trong danh sách...";
            } catch (error) {
                console.error("Lỗi tải dữ liệu sheet:", error);
                nameInput.placeholder = "Lỗi tải dữ liệu!";
            }
        });

        // Bước 3: Khi người dùng chọn hoặc nhập xong tên -> Hiển thị thông tin chi tiết
        nameInput.addEventListener('input', function() {
            let selectedName = this.value.trim();
            let matchedRow = currentSheetData.find(row => row[1] && row[1].toLowerCase() === selectedName.toLowerCase());

            if (matchedRow) {
                let html = '';
                for (let i = 0; i < currentHeaders.length; i++) {
                    let header = currentHeaders[i] || `Cột ${i+1}`;
                    let value = matchedRow[i] !== undefined && matchedRow[i] !== '' ? matchedRow[i] : '(Trống)';
                    
                    html += `
                        <div class="result-item">
                            <div class="result-label">${header}:</div>
                            <div class="result-value">${value}</div>
                        </div>
                    `;
                }
                resultContainer.innerHTML = html;
                resultContainer.style.display = 'block';
            } else {
                resultContainer.style.display = 'none';
            }
        });

        // Tính năng mới: Bấm phím F2 để hiện/ẩn nút Truy cập
        window.addEventListener('keydown', function(e) {
            if (e.key === 'F2') {
                e.preventDefault(); // Chặn hành vi mặc định của F2 trên trình duyệt
                if (accessBtnContainer.style.display === 'block') {
                    accessBtnContainer.style.display = 'none';
                } else {
                    accessBtnContainer.style.display = 'block';
                }
            }
        });

        // Khởi chạy tải danh mục ban đầu khi mở trang
        loadDSsheet();
    </script>
</body>
</html>
