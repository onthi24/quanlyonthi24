<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Tra cứu dữ liệu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #165B33;      /* Xanh rêu đậm tiêu chuẩn từ mẫu */
            --primary-dark: #0F3F23;       
            --primary-light: #F2F8F4;      
            --border-color: #C2D6C7;       
            --text-color: #2C3E35;         
            --bg-color: #F8F9FA;           
            --white: #FFFFFF;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .main-wrapper {
            max-width: 800px;
            width: 100%;
            margin: 30px auto;
            background: var(--white);
            border-radius: var(--border-radius);
            box-shadow: 0 4px 25px rgba(22, 91, 51, 0.08);
            overflow: hidden;
            border: 1px solid #E2E8E4;
        }

        .header-banner {
            background-color: var(--primary-color);
            color: var(--white);
            text-align: center;
            padding: 40px 20px;
        }

        .header-banner h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .header-banner p {
            font-size: 14px;
            opacity: 0.9;
        }

        .content-body {
            padding: 30px;
        }

        .action-bar {
            background-color: var(--primary-light);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .action-bar-text {
            font-size: 14px;
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-reload {
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.3s;
        }

        .btn-reload:hover {
            background-color: var(--primary-dark);
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: var(--primary-dark);
        }

        select, input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            background-color: var(--white);
            transition: all 0.3s ease;
        }

        select:focus, input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(22, 91, 51, 0.12);
        }

        #result-container {
            margin-top: 25px;
            background-color: var(--primary-light);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            display: none;
        }

        .result-item {
            display: flex;
            padding: 10px 0;
            border-bottom: 1px dashed var(--border-color);
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-label {
            font-weight: 600;
            width: 35%;
            color: var(--primary-dark);
        }

        .result-value {
            width: 65%;
            color: var(--text-color);
            word-break: break-word;
        }

        /* Nút Truy cập ẩn ở cuối màn hình (Bấm F2 để bật/tắt) */
        #access-btn-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .access-btn {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 12px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: background 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .access-btn:hover {
            background-color: var(--primary-dark);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, 10px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="header-banner">
            <h1>HỆ THỐNG TRA CỨU DỮ LIỆU</h1>
            <p>Tra cứu nhanh chóng - Tối ưu dữ liệu</p>
        </div>

        <div class="content-body">
            <div class="action-bar">
                <div class="action-bar-text">
                    💡 Bấm <strong>"Làm mới"</strong> để tải lại dữ liệu mới nhất.
                </div>
                <button class="btn-reload" onclick="loadDSsheet()">
                    🔄 Làm mới
                </button>
            </div>

            <div class="form-group">
                <label for="sheet-select">1. Chọn loại dữ liệu:</label>
                <select id="sheet-select">
                    <option value="">-- Đang tải danh sách... --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="name-input">2. Nhập tên để tìm kiếm:</label>
                <input type="text" id="name-input" placeholder="Vui lòng chọn loại dữ liệu trước..." list="name-list" disabled>
                <datalist id="name-list"></datalist>
            </div>

            <div id="result-container"></div>
        </div>
    </div>

    <!-- Nút Truy cập xuất hiện khi bấm phím F2 -->
    <div id="access-btn-container">
        <a href="https://docs.google.com/spreadsheets/d/1mieRfJyDsdevYfwMOhzkrg60pOuBtQ_dkzOW7LfAiA8/edit?gid=0#gid=0" target="_blank" class="access-btn">
            🔗 Truy cập
        </a>
    </div>

    <script>
        const SPREADSHEET_ID = "1mieRfJyDsdevYfwMOhzkrg60pOuBtQ_dkzOW7LfAiA8";
        
        let currentSheetData = [];
        let currentHeaders = [];

        const sheetSelect = document.getElementById('sheet-select');
        const nameInput = document.getElementById('name-input');
        const nameList = document.getElementById('name-list');
        const resultContainer = document.getElementById('result-container');
        const accessBtnContainer = document.getElementById('access-btn-container');

        function parseCSV(text) {
            let lines = [];
            let row = [];
            let inQuotes = false;
            let field = '';
            
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                let next = text[i + 1];
                
                if (c === '"') {
                    if (inQuotes && next === '"') {
                        field += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (c === ',' && !inQuotes) {
                    row.push(field.trim());
                    field = '';
                } else if ((c === '\r' || c === '\n') && !inQuotes) {
                    if (c === '\r' && next === '\n') { i++; }
                    row.push(field.trim());
                    if (row.length > 1 || row[0] !== '') {
                        lines.push(row);
                    }
                    row = [];
                    field = '';
                } else {
                    field += c;
                }
            }
            if (field !== '' || row.length > 0) {
                row.push(field.trim());
                lines.push(row);
            }
            return lines;
        }

        async function loadDSsheet() {
            try {
                sheetSelect.innerHTML = '<option value="">-- Đang tải danh sách... --</option>';
                const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=DS_sheet`;
                const response = await fetch(url);
                const data = await response.text();
                const rows = parseCSV(data);

                sheetSelect.innerHTML = '<option value="">-- Chọn loại dữ liệu --</option>';

                // Đọc cột A (Tên sheet) và cột B (Nội dung hiển thị trong ô chọn) theo yêu cầu
                for (let i = 1; i < rows.length; i++) {
                    let sheetName = rows[i][0];
                    let contentB = rows[i][1]; // Cột B
                    if (sheetName) {
                        let opt = document.createElement('option');
                        opt.value = sheetName;
                        // Hiển thị phần nội dung ở cột B trong ô chọn (ví dụ: Ninh Hiệp, Hải, Phương)
                        opt.textContent = contentB ? contentB : sheetName;
                        sheetSelect.appendChild(opt);
                    }
                }
            } catch (error) {
                console.error("Lỗi tải DS_sheet:", error);
                sheetSelect.innerHTML = '<option value="">Lỗi tải danh mục sheet!</option>';
            }
        }

        sheetSelect.addEventListener('change', async function() {
            let selectedSheet = this.value;
            nameInput.value = '';
            nameInput.disabled = true;
            nameList.innerHTML = '';
            resultContainer.style.display = 'none';

            if (!selectedSheet) {
                nameInput.placeholder = "Vui lòng chọn loại dữ liệu trước...";
                return;
            }

            nameInput.placeholder = "Đang tải dữ liệu...";

            try {
                const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(selectedSheet)}`;
                const response = await fetch(url);
                const data = await response.text();
                const rows = parseCSV(data);

                if (rows.length === 0) {
                    nameInput.placeholder = "Sheet trống!";
                    return;
                }

                currentHeaders = rows[0];
                currentSheetData = rows.slice(1);

                nameList.innerHTML = '';
                currentSheetData.forEach(row => {
                    let name = row[1]; // Cột B (Họ và tên)
                    if (name) {
                        let option = document.createElement('option');
                        option.value = name;
                        nameList.appendChild(option);
                    }
                });

                nameInput.disabled = false;
                nameInput.placeholder = "Gõ hoặc chọn tên để tìm kiếm...";
            } catch (error) {
                console.error("Lỗi tải dữ liệu sheet:", error);
                nameInput.placeholder = "Lỗi tải dữ liệu!";
            }
        });

        nameInput.addEventListener('input', function() {
            let selectedName = this.value.trim();
            let matchedRow = currentSheetData.find(row => row[1] && row[1].toLowerCase() === selectedName.toLowerCase());

            if (matchedRow) {
                let html = '';
                for (let i = 0; i < currentHeaders.length; i++) {
                    let header = currentHeaders[i] || `Cột ${i+1}`;
                    let value = matchedRow[i] !== undefined && matchedRow[i] !== '' ? matchedRow[i] : '(Trống)';
                    
                    html += `
                        <div class="result-item">
                            <div class="result-label">${header}:</div>
                            <div class="result-value">${value}</div>
                        </div>
                    `;
                }
                resultContainer.innerHTML = html;
                resultContainer.style.display = 'block';
            } else {
                resultContainer.style.display = 'none';
            }
        });

        // Bấm phím F2 để hiện/ẩn nút Truy cập ở cuối màn hình
        window.addEventListener('keydown', function(e) {
            if (e.key === 'F2') {
                e.preventDefault();
                if (accessBtnContainer.style.display === 'block') {
                    accessBtnContainer.style.display = 'none';
                } else {
                    accessBtnContainer.style.display = 'block';
                }
            }
        });

        loadDSsheet();
    </script>
</body>
</html>
